<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* Планшет в портретной ориентации: та же раскладка, что на телефоне, увеличенная на всю ширину.
   Колонка #app (520px) получает CSS zoom = ширина экрана / 520; viewport остаётся device-width,
   иначе Android считает страницу немобильной и сам раздувает шрифты. В ландшафте и на телефоне zoom 1. */
var appZoom=1;
(function(){var COL=520;
  function portrait(){var o=screen.orientation&&screen.orientation.type;if(o)return o.indexOf('portrait')===0;
    if(typeof window.orientation==='number')return Math.abs(window.orientation)!==90;return window.innerHeight>window.innerWidth;}
  function fit(){var w=document.documentElement.clientWidth||window.innerWidth,k=(w>=600&&portrait())?Math.floor(w/COL*1000)/1000:1;
    if(k===appZoom)return;appZoom=k;document.documentElement.style.setProperty('--k',String(k));}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});})();
</script>
<title>Греческие слова</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f5fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Греческий">
<meta name="build" content="2026-11-12-4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Home = list of five modes; each mode is a full-height session
   with a scrolling body and a sticky action bar at the bottom. Max width 520px, centered on desktop. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#152238; --muted:#5e6d86; --line:#d5deea;
  --accent:#1f5fa8; --accent-fg:#ffffff; --accent-soft:#e2ecf8;
  --good:#1d8a4b; --good-soft:#def4e6; --bad:#c23b2c; --bad-soft:#fbe3df; --warn:#9a6b00; --warn-soft:#fff1c9;
  --display:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(21,34,56,.06),0 6px 20px rgba(21,34,56,.08);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1726; --surface:#18233a; --fg:#e7edf7; --muted:#9dadc5; --line:#2b3b57;
    --accent:#72acea; --accent-fg:#0b1526; --accent-soft:#1d3253;
    --good:#4fcf87; --good-soft:#173a28; --bad:#ff8273; --bad-soft:#4a221c; --warn:#e9c45c; --warn-soft:#3f3314;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1726; --surface:#18233a; --fg:#e7edf7; --muted:#9dadc5; --line:#2b3b57;
  --accent:#72acea; --accent-fg:#0b1526; --accent-soft:#1d3253;
  --good:#4fcf87; --good-soft:#173a28; --bad:#ff8273; --bad-soft:#4a221c; --warn:#e9c45c; --warn-soft:#3f3314;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;zoom:var(--k,1)}
#app.vv{height:calc(var(--vvh) / var(--k,1))}
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.top-title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn:active{background:var(--accent-soft)}
html{touch-action:manipulation}
button,label,.btn,.tile,.icon-btn{touch-action:manipulation}
main{flex:1;min-height:0;overflow-y:auto;padding-block:6px 24px;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer#actions{flex:0 0 auto;display:flex;gap:10px;padding-block:10px 12px;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer#actions:empty{display:none}

h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15}
h3{font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:22px;margin-bottom:10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
a{color:var(--accent)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:12px 16px;flex:1;min-height:50px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.outline-bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{flex:0 0 auto;min-width:50px;padding-inline:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tile:focus-visible,.icon-btn:focus-visible,.opt:focus-visible,.mode:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical}
input[type=text].big{font-family:var(--display);font-size:24px;text-align:center;padding:14px}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.check .lbl{flex:1}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:11px 8px;cursor:pointer;font-weight:500;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg label.off{opacity:.5}.seg label.on{background:var(--accent);color:var(--accent-fg)}
.seg label.off-dis{opacity:.45}

.hero{display:flex;flex-direction:column;gap:6px;margin-block:10px 6px}
.hero-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero h2{font-size:30px}
.setbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.mixcfg{display:flex;flex-direction:column}
.mixrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mixrow .t{flex:1 1 100%;font-weight:600}
.mixrow label{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.mixrow input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.mixrow .fold-h{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:2px 0;border:0;background:none;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:left}
.mixrow .fold-h .sum{font-weight:400;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mixrow .fold-h i{font-style:normal}
.mixrow .links{flex:1 1 100%;display:flex;gap:14px}
.mixrow .subrow{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mixrow .subrow .t{flex:1 1 100%;font-weight:500;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:14px;color:var(--accent);cursor:pointer;text-decoration:underline}
.prog{display:flex;flex-direction:column;gap:4px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.prog .lab b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;font:inherit;color:inherit;cursor:pointer}
.mode:active{background:var(--accent-soft)}
.mode .num{font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent);width:26px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.mode .txt{flex:1;min-width:0}
.mode .t{font-weight:600}
.mode .d{color:var(--muted);font-size:13.5px}
.badge-dev.off{background:var(--bad-soft);color:var(--bad)}.mode.off{opacity:.6}
.badge-dev{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600;vertical-align:2px;white-space:nowrap}
.mode .arr{color:var(--muted)}

.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.counter{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

.card-wrap{perspective:1200px;margin-block:14px 10px}
.card{position:relative;height:min(46vh,340px);min-height:220px;transform-style:preserve-3d;transition:transform .4s;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.flipped{transform:rotateY(180deg)}
.card.drag{transition:none}
.swipe-wrap{transition:transform .2s}.swipe-wrap.drag{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .lang{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.face .learned-mark{position:absolute;top:10px;right:14px;font-size:13px;color:var(--good);font-weight:600}
.word{font-family:var(--display);font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.word.ru{font-size:clamp(24px,6.5vw,32px)}
.card-tools{display:flex;justify-content:center;gap:10px}
.chip{appearance:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

.prompt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 16px 18px;text-align:center;position:relative;margin-top:12px}
.prompt .lang{position:absolute;top:10px;left:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prompt .word{font-size:clamp(24px,7vw,34px)}

.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px;margin-block:18px 14px}
.slot{width:32px;height:44px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;line-height:1}
.slot.space{width:12px;border:0}
.slot.filled{border-color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:26px;color:var(--fg);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:opacity .15s}
.tile.used{opacity:.18;box-shadow:none;cursor:default}

.result{margin-top:16px;border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;align-items:center}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.result.almost{background:var(--warn-soft);color:var(--warn)}
.prompt .word.sent{font-size:clamp(21px,5.6vw,27px);line-height:1.3}.gap{display:inline-block;width:1.3em;border-bottom:2px solid var(--accent);vertical-align:baseline;margin:0 1px}
.prompt .word.sent.conj{font-size:clamp(17px,4.4vw,21px);line-height:1.45}.prompt .sw.ok{color:var(--good)}.prompt .sw.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:40px;line-height:1;box-shadow:var(--shadow);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,background .15s}
.mic.on{background:var(--bad);transform:scale(1.08);animation:micpulse 1.2s infinite}.mic.busy{opacity:.55}.mic:disabled{opacity:.4;cursor:default}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(194,59,44,.45)}100%{box-shadow:0 0 0 24px rgba(194,59,44,0)}}
.heard{align-self:stretch;min-height:1.4em;text-align:center;color:var(--muted);font-style:italic;font-size:15px}
.mic-wrap .hint{margin-top:0}
.say-form{display:flex;gap:8px;margin-top:16px}.say-form input{flex:1}.say-form .btn{flex:0 0 auto}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bubble{max-width:88%;padding:12px 14px;border-radius:16px;font-size:17px;line-height:1.4}
.bubble.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.bubble .gr{font-family:var(--display);font-size:19px}
.bubble .ru{color:var(--muted);font-size:15px;margin-top:6px}
.bubble .tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.bubble .nw{font-size:13.5px;color:var(--muted);margin-top:8px}
.bubble .fix{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.35);font-size:15px}
.bubble .fix .small{opacity:.85;margin-top:2px}
.bubble.typing{color:var(--muted);letter-spacing:3px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:4px}.dots i{width:11px;height:11px;border-radius:50%;display:inline-block}.dots i.g{background:var(--good)}.dots i.y{background:var(--warn)}.dots i.r{background:var(--bad)}
.bubble.me .dots i{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.sw.new{text-decoration:underline dotted;text-underline-offset:4px;color:var(--accent)}
.sw.out{text-decoration:underline dotted;text-underline-offset:4px;color:var(--warn)}
.mic.sm{width:50px;height:50px;font-size:22px;flex:0 0 auto;box-shadow:none}
.bubble .rp{font-size:16px}.bubble .rp+.gr,.bubble .gr+.rp{margin-top:6px}
.live{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:15px;min-height:46px}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:0 0 auto;opacity:.5}
.live.listen .dot{background:var(--bad);opacity:1;animation:micpulse 1.2s infinite}.live.speak .dot{background:var(--accent);opacity:1}.live.think .dot{background:var(--warn);opacity:1}
.live .st{flex:0 0 auto;font-weight:600}.live .heard{color:var(--muted);flex:1;min-width:0}
.keyfield{-webkit-text-security:disc}
.keyrow{display:flex;gap:8px}.keyrow input{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.result .mark{font-size:30px;font-weight:700;line-height:1;flex:0 0 auto}
.result .body{flex:1;min-width:0}
.result .body .ans{font-family:var(--display);font-size:24px;color:var(--fg);overflow-wrap:anywhere}

.options{display:grid;gap:8px;margin-top:14px}
.optrow{display:flex;gap:8px;align-items:stretch;min-width:0}
.optrow .opt{flex:1;min-width:0}
.optrow .chip{flex:0 0 auto;align-self:center}
.opt{text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:18px;color:inherit;cursor:pointer;font-family:var(--display);overflow-wrap:anywhere}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.mistakes{display:flex;flex-direction:column;gap:6px}
.mistake{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.mistake .g{font-family:var(--display);font-size:19px}
.mistake .r{color:var(--muted);text-align:right}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.gram{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.grow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grow .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:46px;flex:0 0 auto}
.grow .stem{font-size:22px;font-weight:600;white-space:nowrap}
.gi{font:inherit;font-size:22px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.grow .cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.grow .cell small{font-size:11px;color:var(--muted);line-height:1}
.grow .cell.art{flex:0 0 3.4em}.grow .cell.pron{flex:0 0 5.2em}.grow .cell.pron .gi{text-align:center}.grow .cell.end{flex:1}
.grow .cell.art .gi{text-align:center}
.gi:disabled{opacity:.7}
.notice.install{font-size:15px}.notice.install .row{display:flex;gap:8px}.notice.install .btn{flex:1}.notice.install .btn.ghost{flex:0 0 auto}
/* cheat sheet */
.cheat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sec summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:'›';color:var(--muted);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.sec[open] summary::after{transform:rotate(-90deg)}
.sec .body{padding:0 14px 12px;font-size:14px}
.abc{display:grid;grid-template-columns:auto auto auto 1fr;gap:0 10px;align-items:baseline;font-size:14px}
.abc>span{padding:5px 0;border-top:1px solid var(--line);min-width:0}
.abc>span:nth-child(-n+4){border-top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}

<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" data-action="back" aria-label="Назад" hidden>←</button>
    <div class="top-title" id="topTitle">Греческие слова</div>
  </header>
  <main id="screen"></main>
  <footer id="actions"></footer>
</div>
<script src="words.js?v=2026-11-12-4"></script>
<script src="sentences.js?v=2026-11-12-4"></script>
<script src="grammar.js?v=2026-11-12-4"></script>
<script>
(function(){
'use strict';
var LS_KEY='greek-words:v1';
var BUILTIN=(window.WORD_SETS||[]).map(function(s){return Object.assign({},s,{builtin:true});});

function loadStore(){
  var base={setId:null,progress:{},learned:[],typeHits:{},custom:[],mix:{},lex:{},settings:{strictAccents:false,autoSpeak:false,extraMode:'none',scope:'all',shuffle:true}};
  try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);base=Object.assign(base,d);base.settings=Object.assign({strictAccents:false,autoSpeak:false},d.settings||{});
    /* Части речи в Custom до сборки 2026-10-23-3 были дополнением, а не фильтром: старые значения сбрасываем на «все включены». */
    if(base.mix&&base.mix._posV!==2){delete base.mix._pos;base.mix._posV=2;}if(!base.settings.extraMode)base.settings.extraMode=base.settings.useExtra?'with':'none';}}catch(e){}
  return base;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
var store=loadStore();

function allSets(){return BUILTIN.concat(store.custom||[]);}
/* Сборный набор (Custom): слова выбранных уроков, для каждого урока отдельно основная и
   дополнительная лексика. Конфигурация в store.mix[setId]={w:bool,x:bool}. Виртуальный набор
   собирается на лету; прогресс по каждому слову хранится в его исходном уроке. */
var MIX_ID='mix';
var POS_LIST=[['n','Существительные'],['v','Глаголы'],['adj','Прилагательные'],['o','Остальное']];
var POS_DEFAULT={n:true,v:true,adj:true,o:true};
function mixCfg(id){var c=store.mix&&store.mix[id];return c||{w:false,x:false};}
function mixPos(){return Object.assign({},POS_DEFAULT,(store.mix&&store.mix._pos)||{});}
function mixTopics(){return (store.mix&&store.mix._tp)||{};}
function posOf(w){return w.pos||'o';}
/* Темы (поле t в words.js): по ним подбираются варианты в тестах и фильтруется лексика урока.
   store.lex[setId].tp={тема:false} — исключённые темы; остальные включены. */
var TOPIC_LIST=window.TOPICS||[];var TOPIC_PARENT={season:'time'};
function topicOf(w){return w.t||'other';}
function topicName(k){var t=TOPIC_LIST.filter(function(q){return q[0]===k;})[0];return t?t[1]:'Без темы';}
function lexTopics(set){return lexCfg(set).tp||{};}
function topicOn(tp,k){return tp[k]!==false;}
/* Сохранить исключённые темы для урока (target 'lex') или для Custom ('mix'). */
function setTopics(target,tp){
  if(target==='mix'){if(!store.mix)store.mix={};store.mix._tp=tp;}
  else{var st=currentSet();if(!store.lex)store.lex={};var c=Object.assign({},lexCfg(st));c.tp=tp;store.lex[st.id]=c;}
  save();
}
/* Уроки задают пул слов (основная и/или дополнительная лексика каждого), части речи
   его фильтруют (пересечение). По умолчанию включены все части речи; слова без pos —
   наречия, местоимения, фразы — относятся к «Остальное». */
function mixPool(){
  var words=[],origin={};
  allSets().forEach(function(s){var c=mixCfg(s.id);
    s.words.concat(extraOf(s)).forEach(function(w,i){if(!(i<s.words.length?c.w:c.x))return;
      var k=w.gr.toLowerCase();if(origin[k])return;origin[k]=s.id;words.push(w);});});
  return {words:words,origin:origin};
}
function mixSet(){
  var pool=mixPool(),pc=mixPos(),tp=mixTopics();
  var words=pool.words.filter(function(w){return pc[posOf(w)]&&topicOn(tp,topicOf(w));});
  return {id:MIX_ID,title:'Custom',words:words,extra:[],mix:true,origin:pool.origin};
}
function currentSet(){if(store.setId===MIX_ID)return mixSet();var sets=allSets();return sets.filter(function(s){return s.id===store.setId;})[0]||sets[0]||{id:'empty',title:'Нет наборов',words:[]};}
/* Отметка «изучено» едина для слова во всех уроках и без направления: store.learned=[gr...].
   Старые форматы (progress[setId].all, ещё раньше {gr:[],ru:[]}) объединяются в общий список
   при первом обращении, после чего progress удаляется. typeHits[gr] — сколько раз подряд слово
   написано в режиме «Пишем сами» верно с первого раза и без подсказки: после двух оно отмечается
   изученным само. */
function learnedList(){
  if(!store.learned)store.learned=[];
  if(store.progress){var L=store.learned;Object.keys(store.progress).forEach(function(id){var p=store.progress[id]||{};
    (p.all||[]).concat(p.gr||[],p.ru||[]).forEach(function(k){if(L.indexOf(k)<0)L.push(k);});});delete store.progress;save();}
  return store.learned;
}
function extraOf(set){return (set.extra||[]).slice();}
/* Лексика набора выбирается на главном экране: store.lex[setId]={w:основная,x:дополнительная}.
   По умолчанию — как старая настройка extraMode (основная без дополнительной). */
function lexCfg(set){var c=store.lex&&store.lex[set.id];if(c)return c;var m=store.settings.extraMode||'none';return {w:m!=='only',x:m!=='none'};}
function lexPos(set){return Object.assign({},POS_DEFAULT,lexCfg(set).pos||{});}
/* Пул урока: выбранная лексика, затем фильтр по частям речи (как в Custom). */
function lexPool(set){var c=lexCfg(set);return (c.w?set.words:[]).concat(c.x?extraOf(set):[]);}
function lexPosPool(set){var pc=lexPos(set);return lexPool(set).filter(function(w){return pc[posOf(w)];});}
function poolWords(set){if(set.mix)return set.words;var tp=lexTopics(set);return lexPosPool(set).filter(function(w){return topicOn(tp,topicOf(w));});}
function isLearned(set,dir,word){return learnedList().indexOf(word.gr)>=0;}
function setLearned(set,dir,word,val){var arr=learnedList();var i=arr.indexOf(word.gr);if(val&&i<0)arr.push(word.gr);if(!val&&i>=0){arr.splice(i,1);if(store.typeHits)delete store.typeHits[word.gr];}save();}
function learnedCount(set,dir,words){return (words||set.words).filter(function(w){return isLearned(set,dir,w);}).length;}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pct(a,b){return b?Math.round(a/b*100):0;}

/* ---------- text normalisation ---------- */
function stripPunct(s){return s.replace(/[;?!.,·…:«»"()]/g,' ');}
function norm(s,keepAccents){
  var t=String(s).normalize('NFC').toLowerCase();
  t=stripPunct(t).replace(/\s+/g,' ').trim();
  if(!keepAccents){t=t.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');}
  return t;
}
/* ---------- грамматика (grammar.js) ---------- */
var GRAMMAR=window.GRAMMAR||{plural:{},verbs:{}};
var SG_ENDINGS=['ούς','μα','ος','ας','ης','ής','άς','ές','α','ά','η','ή','ο','ό','ι','ί','υ','ύ','ω','ώ','ς'];
var PERSONS_RU=['я','ты','он / она / оно','мы','вы','они'],PERSONS_GR=['εγώ','εσύ','αυτός','εμείς','εσείς','αυτοί'];
/* Местоимения, засчитываемые в режиме спряжения для каждого лица. */
var PERSONS_ALL=[['εγώ'],['εσύ'],['αυτός','αυτή','αυτό'],['εμείς'],['εσείς'],['αυτοί','αυτές','αυτά']];
/* Основа глагола — общее начало всех шести форм (без учёта ударений); окончания — остаток каждой формы и её вариантов. */
function conjSplit(w,p){
  var forms=verbForms(w).map(function(f){return f.split('/').map(function(v){return v.trim().normalize('NFC');});});
  var first=forms.map(function(v){return v[0];}),k=0;
  while(first.every(function(f){return k<f.length-1&&norm(f[k],false)===norm(first[0][k],false);}))k++;
  var stem=first[p].slice(0,k);
  var ends=forms[p].filter(function(v){return norm(v.slice(0,k),false)===norm(stem,false);}).map(function(v){return v.slice(k);});
  return {stem:stem,ends:ends};
}
function pluralOf(w){return GRAMMAR.plural[w.gr]||null;}
function splitArt(s){var m=String(s).normalize('NFC').trim().match(/^(ο|η|το|οι|τα)\s+(.+)$/i);return m?{art:m[1].toLowerCase(),word:m[2]}:{art:'',word:String(s).trim()};}
/* Разбиение «основа + окончание»: окончание ед. ч. берётся из списка известных, основа мн. ч. —
   та же длина с поправкой на сдвиг ударения (сравнение без ударений). */
function stemSplit(sg,pl){
  var a=splitArt(sg),b=splitArt(pl),w=a.word,v=b.word,end='';
  for(var i=0;i<SG_ENDINGS.length;i++){var e=SG_ENDINGS[i];if(w.length>e.length&&w.slice(-e.length)===e){end=e;break;}}
  if(!end)end=w.slice(-1);
  var stem=w.slice(0,w.length-end.length),stem2=v.slice(0,stem.length);
  if(norm(stem2,false)!==norm(stem,false)){var k=0;while(k<w.length&&k<v.length&&norm(w[k],false)===norm(v[k],false))k++;k=Math.max(1,Math.min(k,w.length-1,v.length-1));stem=w.slice(0,k);end=w.slice(k);stem2=v.slice(0,k);}
  return {art1:a.art,stem1:stem,end1:end,art2:b.art,stem2:stem2,end2:v.slice(stem2.length)};
}
function verbForms(w){
  var e=GRAMMAR.verbs[w.gr];if(!e)return null;if(e.f)return e.f;
  var g=w.gr;
  if(e.c==='1'){var st=g.replace(/ω$/,'');return [st+'ω',st+'εις',st+'ει',st+'ουμε',st+'ετε',st+'ουν / '+st+'ουνε'];}
  if(e.c==='2a'){var sa=g.replace(/(άω|ώ)$/,'');return [sa+'ώ / '+sa+'άω',sa+'άς',sa+'ά / '+sa+'άει',sa+'άμε / '+sa+'ούμε',sa+'άτε',sa+'άνε / '+sa+'ούν / '+sa+'ούνε'];}
  if(e.c==='2b'){var sb=g.replace(/ώ$/,'');return [sb+'ώ',sb+'είς',sb+'εί',sb+'ούμε',sb+'είτε',sb+'ούν / '+sb+'ούνε'];}
  return null;
}
function verbRu(w){var e=GRAMMAR.verbs[w.gr];return e&&e.ru;}
/* Слова, пригодные для режима: существительные с формой мн. ч. или глаголы со спряжением. */
function modePool(mode,pool,conj){
  if(mode==='plural')return pool.filter(function(w){return w.pos==='n'&&pluralOf(w);});
  if(mode==='conj')return pool.filter(function(w){return w.pos==='v'&&verbForms(w);});
  if(mode==='say')return conj==='acc'?accWords():conj?pool.filter(function(w){return w.pos==='v'&&verbForms(w);}):pool.filter(function(w){return sentencesFor(w).length;});
  return pool;
}
/* Предложения режимов 9 и 10 (sentences.js): по нескольку на слово. В сеансе слово получает одно
   из них; номер последнего показанного запоминается, чтобы в следующий раз выпало другое. */
function sentencesFor(w){return (window.SENTENCES||{})[w.gr]||[];}
function pickSentence(w){
  var n=sentencesFor(w).length;if(!store.sayLast)store.sayLast={};
  var last=store.sayLast[w.gr],k=Math.floor(Math.random()*n);
  if(n>1&&k===last)k=(k+1+Math.floor(Math.random()*(n-1)))%n;
  store.sayLast[w.gr]=k;save();return k;
}
function casesFor(w){return (GRAMMAR.cases&&GRAMMAR.cases[w.gr])||[];}
/* Режим «Винительный падеж» не зависит от выбранного набора: берётся вся основная лексика курса
   с упражнениями. Сеанс — 25 предложений, поровну мужского, женского, среднего рода и
   множественного числа (по кругу из перемешанных групп). */
var ACC_PER_SESSION=25;
function accWords(){var seen={},out=[];BUILTIN.forEach(function(st){st.words.forEach(function(w){if(!seen[w.gr]&&casesFor(w).length){seen[w.gr]=1;out.push(w);}});});return out;}
function accCategory(w,e){if(/(^|\s)(τους|τις|τα)(\s|$)/.test(e[1])||/(^|\s)(δύο|τρία|τρεις|πολλ)/.test(e[1]))return 'p';return /^ο /.test(w.gr)?'m':/^η /.test(w.gr)?'f':'n';}
function accItems(){
  var groups={m:[],f:[],n:[],p:[]};
  accWords().forEach(function(w){casesFor(w).forEach(function(e,i){groups[accCategory(w,e)].push({w:w,idx:i});});});
  Object.keys(groups).forEach(function(k){shuffle(groups[k]);});
  var out=[],keys=['m','f','n','p'],k=0,guard=0;
  while(out.length<ACC_PER_SESSION&&guard++<4*ACC_PER_SESSION){var g=groups[keys[k%4]];k++;if(g.length)out.push(g.shift());if(!keys.some(function(q){return groups[q].length;}))break;}
  return out;
}
function accTarget(w){
  var it=session.accItems&&session.accItems[session.i],list=casesFor(w);
  var e=(it&&list[it.idx])||list[0]||['','',''];
  return {gr:e[1],ru:e[2],show:e[0],hint:e[1]};
}
function gapHtml(t){return String(t).split(/_+/).map(esc).join('<span class="gap"></span>');}
function sayCur(){if(session.acc)return accTarget(cur());if(session.conj)return conjTarget(cur());var w=cur(),k=session.sentIdx&&session.sentIdx[w.gr],x=sentencesFor(w)[k||0]||[w.gr,w.ru];return {gr:x[0],ru:x[1]};}
/* Режим «Спряжение вслух»: эталон — местоимения и формы по лицам, «αυτός αυτή αυτό» целиком.
   alts — допустимые варианты для каждого слова эталона: варианты формы (ουν / ουνε), для «они»
   также αυτές и αυτά. hint — само слово (1-е лицо) для подсказки звуком. */
function conjTarget(w){
  var forms=verbForms(w)||[],toks=[],alts=[],lines=[];
  PERSONS_ALL.forEach(function(pr,i){
    var fv=String(forms[i]||'').split('/').map(function(x){return x.trim();}).filter(Boolean);
    var pron=i===2?['αυτός','αυτή','αυτό']:[pr[0]];
    pron.forEach(function(x,k){toks.push(x);alts.push(i===5?pr:[x]);});
    toks.push(fv[0]||'');alts.push(fv);
    lines.push(pron.join(' ')+' '+(fv[0]||''));
  });
  return {gr:lines.join(', '),ru:w.ru,hint:primaryTarget(w.gr),alts:alts.map(function(a){return a.map(function(x){return norm(x);});})};
}
function variants(gr){return String(gr).split('/').map(function(v){return v.replace(/\([^)]*\)/g,'').trim();}).filter(Boolean);}
function primaryTarget(gr){var v=variants(gr);return (v[0]||gr).normalize('NFC');}
function lowerGr(s){return String(s).toLocaleLowerCase('el').replace(/σ(?=$|[\s;,.!?·:»"])/g,'ς');}
function grade(answer,gr){
  var vs=variants(gr);var i;
  for(i=0;i<vs.length;i++){if(norm(answer,true)===norm(vs[i],true))return 'exact';}
  for(i=0;i<vs.length;i++){if(norm(answer,false)===norm(vs[i],false))return 'accent';}
  return 'wrong';
}

/* ---------- speech ---------- */
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
(function(){var vv=window.visualViewport;if(!vv)return;var app=document.getElementById('app');
  function fit(){var h=Math.round(vv.height);var full=Math.round(window.innerHeight);
    if(full-h>80){document.documentElement.style.setProperty('--vvh',h+'px');app.classList.add('vv');window.scrollTo(0,0);}
    else{app.classList.remove('vv');}}
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);})();
/* Озвучка в исходном виде первой версии: cancel() и сразу speak(). Обходы для беззвучного
   режима iPhone (беззвучный аудиофайл перед речью, navigator.audioSession.type='playback')
   проверены на устройстве и не помогают: синтез речи глушится боковым переключателем. */
/* raw — текст озвучивается как есть (предложения диалога), иначе берётся первый вариант слова.
   Две меры против «английского» произношения греческого в Chrome на компьютере: список голосов
   там загружается асинхронно (~1,5 с после загрузки страницы), и пока он пуст, фраза без голоса
   уходит голосу по умолчанию, поэтому ждём список (проверено в Chrome 156 на macOS); а speak()
   сразу после cancel() прерванной фразы иногда идёт голосом по умолчанию, поэтому при
   прерывании говорим с задержкой 60 мс. На iPhone голоса доступны сразу, задержек нет. */
var speakWait=0;
/* Вызывает cb, когда список голосов загружен. Если он пуст (в Chrome приходит через ~1,5 с после
   загрузки), ждём его событием и опросом, не дольше 5 с; новый вызов отменяет ожидающий. */
function withVoices(cb){
  var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  if(vs.length){cb();return;}
  var my=++speakWait,t0=Date.now();
  var go=function(){if(my!==speakWait)return;speakWait++;clearInterval(iv);try{speechSynthesis.removeEventListener('voiceschanged',go);}catch(e){}cb();};
  var iv=setInterval(function(){var n=0;try{n=(speechSynthesis.getVoices()||[]).length;}catch(e){}if(n||Date.now()-t0>5000)go();},100);
  try{speechSynthesis.addEventListener('voiceschanged',go);}catch(e){}
}
function speak(text,raw){
  if(!canSpeak)return;
  try{var say=raw?String(text):primaryTarget(text);withVoices(function(){speakNow(say);});}catch(e){}
}
function speakNow(say){
  try{
    var u=new SpeechSynthesisUtterance(say);u.lang='el-GR';u.rate=0.9;
    var g=greekVoices(),v=g.filter(function(v){return /^el[-_]GR$/i.test(v.lang);})[0]||g[0];if(v)u.voice=v;
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(function(){speechSynthesis.speak(u);},60);}
    else{speechSynthesis.cancel();speechSynthesis.speak(u);}
  }catch(e){}
}
/* Голоса загружены, а греческого среди них нет: озвучка прозвучит не по-гречески. */
function greekVoiceMissing(){var all=[];try{all=speechSynthesis.getVoices()||[];}catch(e){}return canSpeak&&all.length>0&&!greekVoices().length;}
/* Как поставить греческий голос: по платформе. Chrome читает список системных голосов при
   запуске, поэтому после установки браузер нужно перезапустить. */
function voiceInstallHint(){
  var ua=navigator.userAgent;
  if(/Android/i.test(ua))return 'На Android: Настройки → Система → Язык и ввод → Синтез речи → Google Text-to-speech → Установка голосовых данных → Ελληνικά.';
  if(/Windows/i.test(ua))return 'На Windows: Параметры → Время и язык → Речь → Добавить голоса → Греческий; в Microsoft Edge греческий голос обычно есть сразу.';
  if(/Macintosh/i.test(ua))return 'На Mac: Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управление голосами → греческий (Melina).';
  return 'Установи греческий голос синтеза речи в настройках системы.';
}
function voiceWarnHtml(){return greekVoiceMissing()?'<p class="notice bad" style="margin-top:10px">Греческий голос не найден: озвучка прозвучит английским голосом. '+voiceInstallHint()+' После установки перезапусти браузер. Проверка: Настройки → Проверить звук.</p>':'';}
if(canSpeak){try{speechSynthesis.getVoices();}catch(e){}}
function greekVoices(){var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}return vs.filter(function(v){return /^el/i.test(v.lang);});}
function speechStatus(){
  if(!canSpeak)return 'Ошибка: браузер не поддерживает синтез речи.';
  var g=greekVoices(),all=[];try{all=speechSynthesis.getVoices()||[];}catch(e){}
  if(g.length)return 'Греческий голос: '+g[0].name+'. Если слово не прозвучало, проверьте переключатель беззвучного режима на телефоне.';
  if(!all.length)return 'Ошибка: браузер ещё не загрузил список голосов, нажми ещё раз через секунду.';
  return 'Ошибка: греческий голос не найден (всего голосов: '+all.length+'). '+voiceInstallHint()+' На iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → Греческий. После установки перезапусти браузер.';
}

/* Метрики: GoatCounter (goatcounter.com) — без cookie, считает уникальных посетителей по дням.
   ANALYTICS_CODE — код сайта из аккаунта GoatCounter (панель на https://<код>.goatcounter.com).
   Пустой код — ничего не подключается и не отправляется. На localhost счётчик не работает.
   Кроме просмотров страницы отправляются события: запуск режима (mode/<режим>), завершение
   тренировки (done/<режим>), открытие шпаргалки (cheat) и первое открытие на устройстве (new-device). */
var ANALYTICS_CODE='learn-greek';
/* Без сети (или пока счётчик не загрузился) события копятся в localStorage и досылаются, когда
   сеть появится: та же схема нужна будущему бэкенду статистики (docs/backend.md). */
var EVENT_QUEUE='greek-words:events';
function isOnline(){return navigator.onLine!==false;}
function trackEvent(path,title){
  if(isOnline()&&window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:path,title:title||path,event:true});}catch(e){}return;}
  try{var q=JSON.parse(localStorage.getItem(EVENT_QUEUE)||'[]');q.push([path,title||path]);if(q.length>200)q=q.slice(-200);localStorage.setItem(EVENT_QUEUE,JSON.stringify(q));}catch(e){}
}
function flushEvents(){
  if(!isOnline()||!(window.goatcounter&&window.goatcounter.count))return;
  var q=[];try{q=JSON.parse(localStorage.getItem(EVENT_QUEUE)||'[]');localStorage.removeItem(EVENT_QUEUE);}catch(e){}
  q.forEach(function(ev){try{window.goatcounter.count({path:ev[0],title:ev[1],event:true});}catch(e){}});
}
window.addEventListener('online',function(){flushEvents();keepScroll=true;render();});
window.addEventListener('offline',function(){keepScroll=true;render();});
/* «Новое устройство»: событие new-device уходит один раз на браузер (отметка в localStorage),
   чтобы считать устройства накопительно; GoatCounter сам уникальность помнит только в пределах дня. */
function trackNewDevice(){
  var k='greek-words:device-counted';
  try{if(localStorage.getItem(k))return;}catch(e){return;}
  var tries=0,t=setInterval(function(){
    if(window.goatcounter&&window.goatcounter.count){clearInterval(t);trackEvent('new-device','Новое устройство');try{localStorage.setItem(k,String(Date.now()));}catch(e){}}
    else if(++tries>50)clearInterval(t);},200);
}
if(ANALYTICS_CODE){var gcs=document.createElement('script');gcs.async=true;gcs.onload=function(){setTimeout(flushEvents,500);};gcs.src='https://gc.zgo.at/count.js';gcs.setAttribute('data-goatcounter','https://'+ANALYTICS_CODE+'.goatcounter.com/count');document.head.appendChild(gcs);trackNewDevice();}

/* ---------- запуск режима ----------
   Настройки тренировки живут на главном экране: лексика, «все / неизученные», перемешивание.
   Нажатие на режим сразу запускает тренировку. */
function freshCount(set){return poolWords(set).filter(function(w){return !isLearned(set,null,w);}).length;}
function startMode(key){
  var m=modeList().filter(function(x){return x.key===key;})[0];if(!m)return;
  if(m.net&&!isOnline()){homeMsg='Режим «'+m.t+'» работает только с интернетом: распознавание речи и модель живут в сети.';render();return;}
  var set=currentSet();
  if(!poolWords(set).length)return;

  homeMsg='';

  view={name:'session',key:key,mode:m.mode,dir:m.dir,conj:!!m.conj,acc:!!m.acc,scope:scope,shuffle:store.settings.shuffle!==false};

function plural(n,a,b,c){var m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c;}

function startSession(words){

  var scopeWords=pool.slice();if(view.scope==='new')scopeWords=scopeWords.filter(function(w){return !isLearned(set,view.dir,w);});
  var accList=null;
  if(view.acc){accList=accItems();words=accList.map(function(x){return x.w;});scopeWords=words.slice();}
  else if(!words){words=scopeWords.slice();if(view.shuffle)shuffle(words);}
  if(!words.length){goHome();return;}
  session={mode:view.mode,dir:view.dir,conj:!!view.conj,acc:!!view.acc,accItems:accList,set:set,pool:pool,words:words,scopeWords:scopeWords,i:0,results:[],flipped:false,state:'ask',picked:[],tiles:null,options:null,typed:''};
  view.name='session';prepareItem();render();
}

  session.aiMsg='';session.aiHeard='';session.aiScore=null;session.aiOk=false;session.wav=null;session.aiBusy=false;
  var w=cur();if(!w)return;

  if(session.mode==='say'){sayStop(true);session.heard='';session.marks=null;session.attempts=0;session.sayMsg='';session.sayTrace='';
    session.sentIdx=session.sentIdx||{};if(session.sentIdx[w.gr]==null)session.sentIdx[w.gr]=pickSentence(w);}
  if(session.mode==='plural'){session.parts={a1:'',e1:'',a2:'',e2:''};}
  if(session.mode==='conj'){session.parts={pr:'',en:''};session.persons=session.persons||{};if(session.persons[w.gr]==null)session.persons[w.gr]=Math.floor(Math.random()*6);session.person=session.persons[w.gr];}
  if(session.mode==='tiles'){
    var target=lowerGr(primaryTarget(w.gr).replace(/[;?!.,·…:«»"]+$/,'').trim());
    session.target=target;
    var chars=Array.from(target).filter(function(c){return c!==' ';});
    var tiles=chars.map(function(c,k){return{ch:c,used:false,k:k};});
    var order=shuffle(tiles.slice());
    if(chars.length>1&&order.map(function(t){return t.ch;}).join('')===chars.join('')){order.reverse();}
    session.tiles=order;
  }
  if(session.mode==='quiz'){
    var ansKey=session.dir==='gr'?'ru':'gr';
    var correct=w[ansKey];
    var seen={};seen[norm(correct,true)]=true;
    var poolFrom=function(list){var out=list.filter(function(x){return x!==w;}).map(function(x){return x[ansKey];}).filter(function(p){var k=norm(p,true);if(seen[k])return false;seen[k]=true;return true;});return shuffle(out);};
    /* Шесть вариантов. Дистракторы той же темы, что и слово (кухня — кухня, части тела —
       части тела): из слов тренировки, затем из набора, затем из всех уроков; потом родительская
       тема (времена года → время), потом та же часть речи, и только потом любые слова. */
    var QUIZ_N=5;
    var sameTopic=function(list,t){return list.filter(function(x){return topicOf(x)===t&&posOf(x)===posOf(w);});};
    var samePos=function(list){return list.filter(function(x){return posOf(x)===posOf(w);});};
    var everything=[];allSets().forEach(function(t){everything=everything.concat(t.words,extraOf(t));});
    var scopeW=session.scopeWords||session.set.words,setW=session.set.words,tiers=[];
    [topicOf(w),TOPIC_PARENT[topicOf(w)]].forEach(function(t){if(t)tiers.push(sameTopic(scopeW,t),sameTopic(setW,t),sameTopic(everything,t));});
    tiers.push(samePos(scopeW),samePos(setW),samePos(everything),scopeW,setW,everything);
    var pool=[];for(var ti=0;ti<tiers.length&&pool.length<QUIZ_N;ti++)pool=pool.concat(poolFrom(tiers[ti]));

/* ---------- режимы 9 и 10: отработка лексики голосом ----------
   Распознавание — Web Speech API браузера (Chrome, Safari), язык el-GR. Кнопку микрофона держат,
   пока говорят. Предложение засчитано, если все его слова распознаны по порядку (без учёта
   ударений, регистра и знаков препинания; лишние слова не мешают). Слова сравниваются по
   звучанию (sayPhon): распознаватель выбирает написание сам и часто отдаёт омофон
   (τις/της, φίλη/φύλη), а произнесено это одинаково. Из вариантов распознавания для каждого
   куска фразы берётся тот, с которым совпадает больше слов. Нераспознанное можно
   повторить сколько угодно раз или пропустить; в очередь сеанса оно не возвращается,
   пока распознавание не проверено на устройствах. */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var canListen=!!SR;
var SAY_NUM={'0':['μηδέν'],'1':['ένα','ένας','μία','μια'],'2':['δύο'],'3':['τρία','τρεις'],'4':['τέσσερα','τέσσερις'],'5':['πέντε'],'6':['έξι'],'7':['επτά','εφτά'],'8':['οκτώ','οχτώ'],'9':['εννέα','εννιά'],'10':['δέκα'],'12':['δώδεκα'],'30':['τριάντα']};
/* Звучание слова без ударений: ι/η/υ/ει/οι/υι → ι, αι → ε, ο/ω → ο, ου → u, αυ/ευ → αv/εv,
   μπ/ντ/γκ/γγ → b/d/g, двойные буквы схлопываются, ς → σ. Слова с одинаковым ключом звучат
   одинаково, так что произношение не прощается, прощается только выбор написания. */
function sayPhon(t){
  return String(t).replace(/ου/g,'u').replace(/([αε])υ/g,'$1v').replace(/ει|οι|υι/g,'ι').replace(/αι/g,'ε')
    .replace(/[ηυ]/g,'ι').replace(/ω/g,'ο').replace(/ς/g,'σ').replace(/μπ/g,'b').replace(/ντ/g,'d').replace(/γ[γκ]/g,'g').replace(/(.)\1+/g,'$1');
}
Object.keys(SAY_NUM).forEach(function(k){SAY_NUM[k]=SAY_NUM[k].map(function(x){return sayPhon(norm(x));});});
function sayTokens(s){return norm(String(s).replace(/[-–—'’]/g,' ')).split(' ').filter(Boolean);}
/* Конечное ν (τον, την, έναν) в речи часто проглатывается — сравниваем без него. */
function sayEq(a,b){
  var x=sayPhon(a),y=sayPhon(b);
  if(x===y||x.replace(/ν$/,'')===y.replace(/ν$/,''))return true;
  return (SAY_NUM[a]||[]).indexOf(y)>=0||(SAY_NUM[b]||[]).indexOf(x)>=0;
}
function sayScore(target,heard,alts){
  var t=sayTokens(target),h=sayTokens(heard),n=t.length,m=h.length,i,j,L=[];
  /* alts[i] — допустимые варианты i-го слова эталона (режим «Спряжение вслух»). */
  var eq=function(i,tok){if(sayEq(t[i],tok))return true;var a=alts&&alts[i];return !!a&&a.some(function(x){return sayEq(x,tok);});};
  for(i=0;i<=n;i++){L.push([]);for(j=0;j<=m;j++)L[i][j]=(i&&j)?(eq(i-1,h[j-1])?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1])):0;}
  var marks=t.map(function(){return false;});i=n;j=m;
  while(i&&j){if(eq(i-1,h[j-1])&&L[i][j]===L[i-1][j-1]+1){marks[i-1]=true;i--;j--;}else if(L[i-1][j]>=L[i][j-1])i--;else j--;}
  return {hit:L[n][m],total:n,ok:L[n][m]===n,marks:marks,text:heard};
}
/* Слова предложения как на экране, с подсветкой: распознанные зелёным, нет — красным. */
function sayMarked(w){
  var marks=session.marks;if(!marks)return esc(w.gr);var k=0;
  return w.gr.split(' ').map(function(word){var n=sayTokens(word).length,ok=true;for(var q=0;q<n;q++){if(!marks[k+q])ok=false;}k+=n;
    return n?'<span class="sw '+(ok?'ok':'miss')+'">'+esc(word)+'</span>':esc(word);}).join(' ');
}
function sayMicHint(){
  if(!canListen&&!sayAudioOnly())return '';

  if(session.micState==='busy')return sayAudioOnly()?'Отправляю запись в ИИ…':'Распознаю…';
  return sayAudioOnly()?'Нажми и держи кнопку, пока говоришь. Запись проверит ИИ.':'Нажми и держи кнопку, пока говоришь.';
}
function renderSay(w){

/* Запись с микрофона в WAV 16 кГц моно 16 бит: ScriptProcessor копит сэмплы, при остановке они

  clearInterval(keyTestTimer);keyTestTimer=setInterval(function(){var n=document.querySelector('.notice');if(n&&/^Проверяю ключ/.test(n.textContent))n.textContent='Проверяю ключ… '+Math.round((Date.now()-t0)/1000)+' с';},1000);
  aiRequest({messages:[{role:'user',content:'Ответь по-гречески одной короткой фразой: поздоровайся.'}],maxTokens:512},function(err,j){
    clearInterval(keyTestTimer);var sec=((Date.now()-t0)/1000).toFixed(1);
    settingsMsg=err?err:(j.stop==='refusal'?'Ошибка: модель отказалась отвечать.':'Ключ работает ('+sec+' с). Модель '+(j.model||claudeModel())+' ответила: «'+String(j.text||'').trim()+'»');
    if(view.name==='settings'){keepScroll=true;render();}
  });
}
function renderQuiz(w){
  var qGr=session.dir==='gr';
  var h=progressHtml();
  h+='<div class="prompt"><div class="lang">'+(qGr?'Греческий':'Русский')+'</div><div class="word'+(qGr?'':' ru')+'">'+esc(qGr?w.gr:w.ru)+'</div></div>';
  if(qGr&&canSpeak)h+='<div class="card-tools" style="margin-top:10px">'+speakBtn(w.gr)+'</div>';
  h+='<div class="options">'+session.options.map(function(o,k){
    var cls='opt';
    if(session.state!=='ask'){if(o===session.correctOpt)cls+=' correct';else if(k===session.pickedOpt)cls+=' wrong';}
    var b='<button class="'+cls+'" data-action="opt" data-k="'+k+'"'+(session.state!=='ask'?' disabled':'')+'>'+esc(o)+'</button>';
    if(!qGr&&canSpeak)b='<div class="optrow">'+b+'<button class="chip" data-action="speak" data-text="'+esc(o)+'" aria-label="Озвучить">🔊</button></div>';
    return b;
  }).join('')+'</div>';
  var foot='';
  if(session.state!=='ask'){foot=doneFoot();}
  return{html:h,foot:foot};
}

function resultHtml(w){
  if(session.state==='ask')return '';
  var writing=(session.mode==='tiles'||session.mode==='type');var g=session.grade;var full=writing?lowerGr(primaryTarget(w.gr)):primaryTarget(w.gr);
  var spk=(canSpeak&&!writing)?'<button class="chip" data-action="speak" data-text="'+esc(w.gr)+'">🔊</button>':'';
  if(g==='exact')return '<div class="result ok" role="status"><span class="mark">✓</span><div class="body"><div>Верно!</div></div>'+spk+'</div>';
  if(g==='hint')return '<div class="result almost" role="status"><span class="mark">✓</span><div class="body"><div>Верно, но с подсказкой.</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
  if(g==='accent')return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверное ударение. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
  return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверно. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
}

function finishItem(grade,given){
  if(grade==='exact'&&session.hinted)grade='hint';
  session.grade=grade;session.state='done';
  var ok=grade==='exact';
  /* Режим «Пишем сами», первое появление слова в сеансе: счёт верных ответов с первого раза без
     подсказки; ошибка или подсказка обнуляет счёт, второй подряд верный ответ отмечает слово изученным. */
  if(session.mode==='type'&&session.words.indexOf(cur())===session.i){var w=cur();if(!store.typeHits)store.typeHits={};
    if(ok){var n=(store.typeHits[w.gr]||0)+1;store.typeHits[w.gr]=n;
      if(n>=2&&!isLearned(session.set,null,w)){setLearned(session.set,null,w,true);session.autoLearned=(session.autoLearned||[]).concat([w]);}}
    else delete store.typeHits[w.gr];
    save();}
  if(!session.results[session.i]){
    session.results[session.i]={word:cur(),ok:ok,grade:grade,given:given};
    if(!ok){var pos=Math.min(session.i+3,session.words.length);session.words.splice(pos,0,cur());session.requeued=true;}
  }
}
function learnedUpdates(){
  var set=session.set,dir=session.dir;var wrongW=firstWrong().map(function(r){return r.word;});
  var unlearn=wrongW.filter(function(w){return isLearned(set,dir,w);});
  var okW=uniqWords(session.words).filter(function(w){return wrongW.indexOf(w)<0&&session.results.some(function(r){return r&&r.word===w&&r.ok;});});
  var learn=okW.filter(function(w){return !isLearned(set,dir,w);});
  return{unlearn:unlearn,learn:learn};
}
function uniqWords(list){var seen={};return list.filter(function(w){if(seen[w.gr])return false;seen[w.gr]=true;return true;});}
function firstWrong(){var seen={};return session.results.filter(Boolean).filter(function(r){if(seen[r.word.gr])return false;seen[r.word.gr]=true;return !r.ok;});}
function doneFoot(){var wrong=session.grade!=='exact';
  return (wrong?'<button class="btn" data-action="retry">Ещё раз</button>':'')+'<button class="btn primary" data-action="next">Далее</button>';}
function next(){
  if(session.i+1>=session.words.length){view.name='end';trackEvent('done/'+view.key,'Завершено: '+sessionTitle());render();return;}
  session.i++;prepareItem();render();
}

/* ---------- end ---------- */
function renderEnd(){
  var h='',foot='';
  if(session.mode==='say'){
    var sres=session.results.filter(Boolean),stotal=session.words.length,sok=sres.filter(function(r){return r.ok;}).length;
    var first=sres.filter(function(r){return r.ok&&r.attempts===1&&r.grade==='exact';}).length,skipped=sres.filter(function(r){return !r.ok;});
    h+='<div class="summary"><div class="score">'+sok+'<small> / '+stotal+' распознано</small></div>';
    h+='<p class="muted">С первой попытки и без подсказки: '+first+'.</p>';
    if(skipped.length){h+='<h3 style="margin-top:6px">Пропущенные</h3><div class="mistakes">'+skipped.map(function(r){var x=r.sent||r.word;return '<div class="mistake"><span class="g">'+esc(x.gr)+'</span><span class="r">'+esc(x.ru)+(r.given?'<br><s class="small">'+esc(r.given)+'</s>':'')+'</span></div>';}).join('')+'</div>';}
    h+='</div>';
    foot=(skipped.length?'<button class="btn primary" data-action="retry-wrong">Повторить пропущенные</button>':'')+'<button class="btn" data-action="restart">Ещё раз</button><button class="btn ghost" data-action="home">⌂</button>';
    return{html:h,foot:foot};
  }
  if(session.mode==='flash'){
    var known=session.results.filter(function(r){return r&&r.known;}).length;
    var learning=session.results.filter(function(r){return r&&!r.known;}).map(function(r){return r.word;});
    var total=session.words.length;
    h+='<div class="summary"><div class="score">'+known+'<small> / '+total+' знаю</small></div>';
    h+='<p class="muted">Изучено: '+learnedCount(session.set,null,session.pool)+' из '+session.pool.length+'.</p>';
    if(learning.length){h+='<h3 style="margin-top:6px">Ещё учу</h3><div class="mistakes">'+learning.map(function(w){return '<div class="mistake"><span class="g">'+esc(w.gr)+'</span><span class="r">'+esc(w.ru)+'</span></div>';}).join('')+'</div>';}
    h+='</div>';
    foot=(learning.length?'<button class="btn primary" data-action="retry-learning">Повторить те, что учу</button>':'')+'<button class="btn" data-action="restart">Сначала</button><button class="btn ghost" data-action="home">⌂</button>';
  }else{
    var res=session.results.filter(Boolean);
    var wrong=firstWrong();var total=uniqWords(session.words).length;var correct=total-wrong.length;
    var fixed=wrong.filter(function(r){return res.some(function(x){return x.word===r.word&&x.ok;});}).length;
    h+='<div class="summary"><div class="score">'+correct+'<small> / '+total+' с первой попытки</small></div>';
    h+='<p class="muted">'+(wrong.length?(fixed===wrong.length?'Все ошибки исправлены в этом сеансе.':'Исправлено при повторе: '+fixed+' из '+wrong.length+'.'):'Без ошибок. Отлично!')+'</p>';
    if(wrong.length){h+='<h3 style="margin-top:6px">Ошибки</h3><div class="mistakes">'+wrong.map(function(r){return '<div class="mistake"><span class="g">'+esc(r.word.gr)+'</span><span class="r">'+esc(r.word.ru)+(r.given?'<br><s class="small">'+esc(r.given)+'</s>':'')+'</span></div>';}).join('')+'</div>';}
    h+='</div>';
    if(session.mode==='tiles'||session.mode==='type'){
      if(session.autoLearned&&session.autoLearned.length)h+='<p class="notice ok" style="margin-top:10px">Отмечены изученными: '+session.autoLearned.map(function(w){return esc(w.gr);}).join(', ')+' — дважды написаны верно с первого раза.</p>';
      var upd=learnedUpdates();
      if(upd.unlearn.length||upd.learn.length){
        h+='<h3 style="margin-top:14px">Список изученных</h3><div class="stack" style="gap:8px">';
        if(upd.unlearn.length)h+='<button class="btn" data-action="unlearn-wrong">Снять «изучено» с ошибок ('+upd.unlearn.length+')</button>';
        if(upd.learn.length)h+='<button class="btn" data-action="learn-correct">Отметить верные как изученные ('+upd.learn.length+')</button>';
        h+='</div>';
      }
      if(session.endMsg)h+='<p class="notice" style="margin-top:10px">'+esc(session.endMsg)+'</p>';
    }
    foot=(wrong.length?'<button class="btn primary" data-action="retry-wrong">Повторить ошибки</button>':'')+'<button class="btn" data-action="restart">Ещё раз</button><button class="btn ghost" data-action="home">⌂</button>';
  }
  return{html:h,foot:foot};
}

/* ---------- рассказ о себе ----------
   Личный текст ученика (ответы на вопросы устного экзамена) из его Google Документа. Хранится только
   в этом браузере (localStorage, отдельный ключ, не сбрасывается вместе с прогрессом) и никуда не
   уходит, кроме модели ИИ при проверке произношения. Документ должен быть открыт по ссылке для чтения:
   тогда docs.google.com/document/d/ID/export?format=txt отдаёт текст с заголовком CORS для любого
   источника (проверено 2026-11-12). Разделы — нумерованные строки «1. Вопрос / Ερώτηση;», ниже ответ
   по-русски и по-гречески; греческие строки озвучиваются и проверяются, русские — подсказка. */
var STORY_KEY='greek-words:story';
var story=null;try{story=JSON.parse(localStorage.getItem(STORY_KEY)||'null');if(story&&!(story.sections&&story.sections.length))story=null;}catch(e){story=null;}
var storyUi={rec:-1,busy:-1,res:{},err:'',loading:false,hide:false,shown:{}};
function storySave(){try{if(story)localStorage.setItem(STORY_KEY,JSON.stringify(story));else localStorage.removeItem(STORY_KEY);}catch(e){}}
/* Политонические знаки, набранные по ошибке (ὼ, ὲ), приводятся к обычному ударению. */
function storyMono(t){return String(t).normalize('NFD').replace(/[̀͂]/g,'́').replace(/[̓̔ͅ]/g,'').normalize('NFC');}
function hasGreek(t){return /[Ͱ-Ͽἀ-῿]/.test(t);}
function storyDocId(u){var m=String(u||'').match(/docs\.google\.com\/document\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]+)/);return m?m[1]:'';}
function storyParse(txt){
  var lines=String(txt||'').replace(/^﻿/,'').split(/\r?\n/).map(function(l){return l.replace(/\s+/g,' ').trim();});
  var start=/^(\d+)\s*[.)]\s+(.*)$/,numbered=lines.some(function(l){return start.test(l);});
  var secs=[],cur=null,title='';
  function open(n,head){cur={n:n,q:'',qgr:'',ru:[],gr:[]};secs.push(cur);
    if(head){var parts=head.split(/\s*\/\s*/);cur.q=parts.filter(function(p){return !hasGreek(p);}).join(' / ');cur.qgr=storyMono(parts.filter(hasGreek).join(' '));}}
  lines.forEach(function(l){
    if(!l){if(!numbered)cur=null;return;}
    if(numbered){var m=l.match(start);if(m){open(m[1],m[2]);return;}if(!cur){if(!title)title=l;return;}}
    else if(!cur){if(!secs.length&&!title&&!hasGreek(l)){title=l;return;}open(String(secs.length+1),hasGreek(l)?'':l);if(!hasGreek(l))return;}
    if(hasGreek(l))cur.gr.push(storyMono(l));else cur.ru.push(l);
  });
  return {title:title,sections:secs.filter(function(x){return x.gr.length;})};
}
function storyText(sec){return sec.gr.map(function(l){return /[.;!?…]$/.test(l)?l:l+'.';}).join(' ');}
function storyApply(txt,url,id){
  var p=storyParse(txt);
  if(!p.sections.length){storyMsg('Ошибка: в документе не нашлось разделов с греческим текстом. Нужны нумерованные вопросы («1. …») и под ними ответ по-гречески.');render();return;}
  story={url:url||'',id:id||'',title:p.title,sections:p.sections,at:Date.now()};
  storyUi.res={};storyUi.err='';storyUi.shown={};storySave();trackEvent('story-load','Рассказ: загрузка');
  storyMsg('Загружено: '+(p.title||'рассказ')+', '+p.sections.length+' '+plural(p.sections.length,'раздел','раздела','разделов')+'. Режим «Рассказ о себе» появился на главном экране после шпаргалки.');render();
}
/* Сообщения загрузки: в настройках — в разделе «Рассказ о себе», на экране рассказа — вверху. */
function storyMsg(m){if(view.name==='settings'){settingsMsg=m;settingsMsgAt='story';keepScroll=true;}else storyUi.err=m;}
function storyLoad(url){
  var id=storyDocId(url);
  if(!id){storyMsg('Ошибка: это не ссылка на Google Документ. Нужна ссылка вида docs.google.com/document/d/…');render();return;}
  if(!isOnline()){storyMsg('Ошибка: нет сети. Загрузи документ при подключении.');render();return;}
  /* Другая ссылка: старый рассказ стирается сразу, чтобы при неудачной загрузке не остался чужой текст. */
  if(story&&story.id!==id){story=null;storyUi.res={};storySave();}
  storyUi.loading=true;storyUi.err='';if(view.name==='settings'){settingsMsg='';}keepScroll=true;render();
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},30000);
  fetch('https://docs.google.com/document/d/'+id+'/export?format=txt',{signal:ctl.signal,credentials:'omit'})
    .then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(t){storyUi.loading=false;if(/^\s*<(!doctype|html)/i.test(t))throw new Error('html');storyApply(t,url,id);})
    .catch(function(e){clearTimeout(tm);storyUi.loading=false;
      storyMsg('Ошибка: не удалось загрузить документ'+(e.name==='AbortError'?' (нет ответа за 30 секунд)':e.message==='html'?'':' ('+e.message+')')+'. Проверь, что он открыт по ссылке: в Google Документах «Поделиться» → «Все, у кого есть ссылка» → «Читатель».');render();});
}

function hasGreek(s){return /[Ͱ-Ͽἀ-῿]/.test(s);}
function parseImport(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);var out=[];
  lines.forEach(function(l){
    var parts;
    if(l.indexOf('\t')>=0)parts=l.split('\t');
    else if(/\s[-–—]\s/.test(l))parts=l.split(/\s[-–—]\s/);
    else if(l.indexOf(';')>=0&&!/;\s*$/.test(l))parts=l.split(';');
    else return;
    var a=parts[0].trim(),b=parts.slice(1).join(' ').trim();
    if(!a||!b)return;
    if(!hasGreek(a)&&hasGreek(b)){var t=a;a=b;b=t;}
    out.push({gr:a,ru:b});
  });
  return out;
}
