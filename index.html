<script>
/* Планшет в портретной ориентации: та же раскладка, что на телефоне, увеличенная на всю ширину.
   Колонка #app (520px) получает CSS zoom = ширина экрана / 520; viewport остаётся device-width,
   иначе Android считает страницу немобильной и сам раздувает шрифты. В ландшафте и на телефоне zoom 1. */
var appZoom=1;
(function(){var COL=520;
  function portrait(){var o=screen.orientation&&screen.orientation.type;if(o)return o.indexOf('portrait')===0;
    if(typeof window.orientation==='number')return Math.abs(window.orientation)!==90;return window.innerHeight>window.innerWidth;}
  function fit(){var w=document.documentElement.clientWidth||window.innerWidth,k=(w>=600&&portrait())?Math.floor(w/COL*1000)/1000:1;
    if(k===appZoom)return;appZoom=k;document.documentElement.style.setProperty('--k',String(k));}
  fit();window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,300);});})();
</script>

<style>
/* Layout: one-screen phone app. Home = list of five modes; each mode is a full-height session
   with a scrolling body and a sticky action bar at the bottom. Max width 520px, centered on desktop. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --fg:#152238; --muted:#5e6d86; --line:#d5deea;
  --accent:#1f5fa8; --accent-fg:#ffffff; --accent-soft:#e2ecf8;
  --good:#1d8a4b; --good-soft:#def4e6; --bad:#c23b2c; --bad-soft:#fbe3df; --warn:#9a6b00; --warn-soft:#fff1c9;
  --display:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(21,34,56,.06),0 6px 20px rgba(21,34,56,.08);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1726; --surface:#18233a; --fg:#e7edf7; --muted:#9dadc5; --line:#2b3b57;
    --accent:#72acea; --accent-fg:#0b1526; --accent-soft:#1d3253;
    --good:#4fcf87; --good-soft:#173a28; --bad:#ff8273; --bad-soft:#4a221c; --warn:#e9c45c; --warn-soft:#3f3314;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1726; --surface:#18233a; --fg:#e7edf7; --muted:#9dadc5; --line:#2b3b57;
  --accent:#72acea; --accent-fg:#0b1526; --accent-soft:#1d3253;
  --good:#4fcf87; --good-soft:#173a28; --bad:#ff8273; --bad-soft:#4a221c; --warn:#e9c45c; --warn-soft:#3f3314;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;zoom:var(--k,1)}
#app.vv{height:calc(var(--vvh) / var(--k,1))}
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.top-title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn:active{background:var(--accent-soft)}
html{touch-action:manipulation}
button,label,.btn,.tile,.icon-btn{touch-action:manipulation}
main{flex:1;min-height:0;overflow-y:auto;padding-block:6px 24px;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer#actions{flex:0 0 auto;display:flex;gap:10px;padding-block:10px 12px;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer#actions:empty{display:none}

h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15}
h3{font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:22px;margin-bottom:10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
a{color:var(--accent)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:12px 16px;flex:1;min-height:50px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.outline-bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{flex:0 0 auto;min-width:50px;padding-inline:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tile:focus-visible,.icon-btn:focus-visible,.opt:focus-visible,.mode:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical}
input[type=text].big{font-family:var(--display);font-size:24px;text-align:center;padding:14px}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.check .lbl{flex:1}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:11px 8px;cursor:pointer;font-weight:500;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg label.on{background:var(--accent);color:var(--accent-fg)}
.seg label.off-dis{opacity:.45}

.hero{display:flex;flex-direction:column;gap:6px;margin-block:10px 6px}
.hero-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero h2{font-size:30px}
.setbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.mixcfg{display:flex;flex-direction:column}
.mixrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mixrow .t{flex:1 1 100%;font-weight:600}
.mixrow label{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.mixrow input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.mixrow .fold-h{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:2px 0;border:0;background:none;font:inherit;font-weight:600;color:inherit;cursor:pointer;text-align:left}
.mixrow .fold-h .sum{font-weight:400;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mixrow .fold-h i{font-style:normal}
.mixrow .links{flex:1 1 100%;display:flex;gap:14px}
.mixrow .subrow{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mixrow .subrow .t{flex:1 1 100%;font-weight:500;font-size:14px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-size:14px;color:var(--accent);cursor:pointer;text-decoration:underline}
.prog{display:flex;flex-direction:column;gap:4px}
.prog .lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.prog .lab b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;font:inherit;color:inherit;cursor:pointer}
.mode:active{background:var(--accent-soft)}
.mode .num{font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent);width:26px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.mode .txt{flex:1;min-width:0}
.mode .t{font-weight:600}
.mode .d{color:var(--muted);font-size:13.5px}
.mode .arr{color:var(--muted)}

.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.counter{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

.card-wrap{perspective:1200px;margin-block:14px 10px}
.card{position:relative;height:min(46vh,340px);min-height:220px;transform-style:preserve-3d;transition:transform .4s;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.flipped{transform:rotateY(180deg)}
.card.drag{transition:none}
.swipe-wrap{transition:transform .2s}.swipe-wrap.drag{transition:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .lang{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.face .learned-mark{position:absolute;top:10px;right:14px;font-size:13px;color:var(--good);font-weight:600}
.word{font-family:var(--display);font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.word.ru{font-size:clamp(24px,6.5vw,32px)}
.card-tools{display:flex;justify-content:center;gap:10px}
.chip{appearance:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}

.prompt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 16px 18px;text-align:center;position:relative;margin-top:12px}
.prompt .lang{position:absolute;top:10px;left:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prompt .word{font-size:clamp(24px,7vw,34px)}

.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px;margin-block:18px 14px}
.slot{width:32px;height:44px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;line-height:1}
.slot.space{width:12px;border:0}
.slot.filled{border-color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:26px;color:var(--fg);box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:opacity .15s}
.tile.used{opacity:.18;box-shadow:none;cursor:default}

.result{margin-top:16px;border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;align-items:center}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.result.almost{background:var(--warn-soft);color:var(--warn)}
.result .mark{font-size:30px;font-weight:700;line-height:1;flex:0 0 auto}
.result .body{flex:1;min-width:0}
.result .body .ans{font-family:var(--display);font-size:24px;color:var(--fg);overflow-wrap:anywhere}

.options{display:grid;gap:8px;margin-top:14px}
.optrow{display:flex;gap:8px;align-items:stretch;min-width:0}
.optrow .opt{flex:1;min-width:0}
.optrow .chip{flex:0 0 auto;align-self:center}
.opt{text-align:left;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:18px;color:inherit;cursor:pointer;font-family:var(--display);overflow-wrap:anywhere}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.mistakes{display:flex;flex-direction:column;gap:6px}
.mistake{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.mistake .g{font-family:var(--display);font-size:19px}
.mistake .r{color:var(--muted);text-align:right}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.gram{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.grow{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grow .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:46px;flex:0 0 auto}
.grow .stem{font-size:22px;font-weight:600;white-space:nowrap}
.gi{font:inherit;font-size:22px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.grow .cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.grow .cell small{font-size:11px;color:var(--muted);line-height:1}
.grow .cell.art{flex:0 0 3.4em}.grow .cell.end{flex:1}
.grow .cell.art .gi{text-align:center}
.gi:disabled{opacity:.7}
.notice.install{font-size:15px}.notice.install .row{display:flex;gap:8px}.notice.install .btn{flex:1}.notice.install .btn.ghost{flex:0 0 auto}
/* cheat sheet */
.cheat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sec summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:'›';color:var(--muted);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.sec[open] summary::after{transform:rotate(-90deg)}
.sec .body{padding:0 14px 12px;font-size:14px}
.abc{display:grid;grid-template-columns:auto auto auto 1fr;gap:0 10px;align-items:baseline;font-size:14px}
.abc>span{padding:5px 0;border-top:1px solid var(--line);min-width:0}
.abc>span:nth-child(-n+4){border-top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.abc .L{font-size:21px;font-weight:600;color:var(--accent);white-space:nowrap}
.abc .S{font-weight:600;white-space:nowrap}
.abc .E{color:var(--muted);overflow-wrap:anywhere}
.rule{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.rule:first-child{border-top:0}
.rule .k{font-size:19px;font-weight:600;color:var(--accent);white-space:nowrap}
.rule .v{font-weight:500}
.rule .e{grid-column:2;color:var(--muted);overflow-wrap:anywhere}
.ex{color:var(--fg);font-weight:500;cursor:pointer;border-bottom:1px dotted var(--muted)}
.cheat p.note{margin:0;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.cheat p.note:first-child{border-top:0}
.cheat .sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.art{display:grid;gap:0 14px;align-items:baseline;font-size:14px}
.art.c3{grid-template-columns:1fr auto auto}.art.c2{grid-template-columns:1fr auto}.art.conj{grid-template-columns:auto auto 1fr;gap:0 12px}.art.conj .A.E{font-size:15px}
.art.conj4{grid-template-columns:auto 1fr 1fr 1fr;gap:0 8px}.art.conj4 .A.E{font-size:15px}.art.conj4>span.h{text-transform:none;letter-spacing:0;font-size:12px}
.art.conj4 .A.E small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:1px}
.art>span{padding:6px 0;border-top:1px solid var(--line);min-width:0}
.art>span.h{border-top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.art .A{font-size:21px;font-weight:600;color:var(--accent);text-align:center;min-width:2.2em}
.art .A.E{font-size:16px;text-align:left;white-space:normal;overflow-wrap:anywhere}
.notice.ok{background:var(--good-soft);color:var(--good)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.danger-zone{display:flex;flex-direction:column;gap:10px}

@media (prefers-reduced-motion: reduce){
  .card,.progress i,.tile{transition:none}
}
</style>

<div id="app">
  <header class="top">
    <button class="icon-btn" id="backBtn" data-action="back" aria-label="Назад" hidden>←</button>
    <div class="top-title" id="topTitle">Греческие слова</div>
  </header>
  <main id="screen"></main>
  <footer id="actions"></footer>
</div>
<script src="words.js?v=2026-10-29-3"></script>
<script src="grammar.js?v=2026-10-29-3"></script>
<script>
(function(){
'use strict';
var LS_KEY='greek-words:v1';
var BUILTIN=(window.WORD_SETS||[]).map(function(s){return Object.assign({},s,{builtin:true});});

function loadStore(){
  var base={setId:null,progress:{},custom:[],mix:{},lex:{},settings:{strictAccents:false,autoSpeak:false,extraMode:'none',scope:'all',shuffle:true}};
  try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);base=Object.assign(base,d);base.settings=Object.assign({strictAccents:false,autoSpeak:false},d.settings||{});
    /* Части речи в Custom до сборки 2026-10-23-3 были дополнением, а не фильтром: старые значения сбрасываем на «все включены». */
    if(base.mix&&base.mix._posV!==2){delete base.mix._pos;base.mix._posV=2;}if(!base.settings.extraMode)base.settings.extraMode=base.settings.useExtra?'with':'none';}}catch(e){}
  return base;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(store));}catch(e){}}
var store=loadStore();

function allSets(){return BUILTIN.concat(store.custom||[]);}
/* Сборный набор (Custom): слова выбранных уроков, для каждого урока отдельно основная и
   дополнительная лексика. Конфигурация в store.mix[setId]={w:bool,x:bool}. Виртуальный набор
   собирается на лету; прогресс по каждому слову хранится в его исходном уроке. */
var MIX_ID='mix';
var POS_LIST=[['n','Существительные'],['v','Глаголы'],['adj','Прилагательные'],['o','Остальное']];
var POS_DEFAULT={n:true,v:true,adj:true,o:true};
function mixCfg(id){var c=store.mix&&store.mix[id];return c||{w:false,x:false};}
function mixPos(){return Object.assign({},POS_DEFAULT,(store.mix&&store.mix._pos)||{});}
function mixTopics(){return (store.mix&&store.mix._tp)||{};}
function posOf(w){return w.pos||'o';}
/* Темы (поле t в words.js): по ним подбираются варианты в тестах и фильтруется лексика урока.
   store.lex[setId].tp={тема:false} — исключённые темы; остальные включены. */
var TOPIC_LIST=window.TOPICS||[];var TOPIC_PARENT={season:'time'};
function topicOf(w){return w.t||'other';}
function topicName(k){var t=TOPIC_LIST.filter(function(q){return q[0]===k;})[0];return t?t[1]:'Без темы';}
function lexTopics(set){return lexCfg(set).tp||{};}
function topicOn(tp,k){return tp[k]!==false;}
/* Сохранить исключённые темы для урока (target 'lex') или для Custom ('mix'). */
function setTopics(target,tp){
  if(target==='mix'){if(!store.mix)store.mix={};store.mix._tp=tp;}
  else{var st=currentSet();if(!store.lex)store.lex={};var c=Object.assign({},lexCfg(st));c.tp=tp;store.lex[st.id]=c;}
  save();
}
/* Уроки задают пул слов (основная и/или дополнительная лексика каждого), части речи
   его фильтруют (пересечение). По умолчанию включены все части речи; слова без pos —
   наречия, местоимения, фразы — относятся к «Остальное». */
function mixPool(){
  var words=[],origin={};
  allSets().forEach(function(s){var c=mixCfg(s.id);
    s.words.concat(extraOf(s)).forEach(function(w,i){if(!(i<s.words.length?c.w:c.x))return;
      var k=w.gr.toLowerCase();if(origin[k])return;origin[k]=s.id;words.push(w);});});
  return {words:words,origin:origin};
}
function mixSet(){
  var pool=mixPool(),pc=mixPos(),tp=mixTopics();
  var words=pool.words.filter(function(w){return pc[posOf(w)]&&topicOn(tp,topicOf(w));});
  return {id:MIX_ID,title:'Custom',words:words,extra:[],mix:true,origin:pool.origin};
}
function currentSet(){if(store.setId===MIX_ID)return mixSet();var sets=allSets();return sets.filter(function(s){return s.id===store.setId;})[0]||sets[0]||{id:'empty',title:'Нет наборов',words:[]};}
/* Отметка «изучено» едина для слова, без направления: progress[setId].all=[gr...].
   Старый формат {gr:[],ru:[]} объединяется при первом обращении. */
function progressFor(setId){if(!store.progress[setId])store.progress[setId]={all:[]};var p=store.progress[setId];
  if(!p.all){p.all=[];(p.gr||[]).concat(p.ru||[]).forEach(function(k){if(p.all.indexOf(k)<0)p.all.push(k);});delete p.gr;delete p.ru;}
  return p;}
function progressOf(set,word){return progressFor(set.mix?(set.origin[word.gr.toLowerCase()]||set.id):set.id);}
function extraOf(set){return (set.extra||[]).slice();}
/* Лексика набора выбирается на главном экране: store.lex[setId]={w:основная,x:дополнительная}.
   По умолчанию — как старая настройка extraMode (основная без дополнительной). */
function lexCfg(set){var c=store.lex&&store.lex[set.id];if(c)return c;var m=store.settings.extraMode||'none';return {w:m!=='only',x:m!=='none'};}
function lexPos(set){return Object.assign({},POS_DEFAULT,lexCfg(set).pos||{});}
/* Пул урока: выбранная лексика, затем фильтр по частям речи (как в Custom). */
function lexPool(set){var c=lexCfg(set);return (c.w?set.words:[]).concat(c.x?extraOf(set):[]);}
function lexPosPool(set){var pc=lexPos(set);return lexPool(set).filter(function(w){return pc[posOf(w)];});}
function poolWords(set){if(set.mix)return set.words;var tp=lexTopics(set);return lexPosPool(set).filter(function(w){return topicOn(tp,topicOf(w));});}
function isLearned(set,dir,word){return progressOf(set,word).all.indexOf(word.gr)>=0;}
function setLearned(set,dir,word,val){var arr=progressOf(set,word).all;var i=arr.indexOf(word.gr);if(val&&i<0)arr.push(word.gr);if(!val&&i>=0)arr.splice(i,1);save();}
function learnedCount(set,dir,words){return (words||set.words).filter(function(w){return isLearned(set,dir,w);}).length;}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pct(a,b){return b?Math.round(a/b*100):0;}

/* ---------- text normalisation ---------- */
function stripPunct(s){return s.replace(/[;?!.,·…:«»"()]/g,' ');}
function norm(s,keepAccents){
  var t=String(s).normalize('NFC').toLowerCase();
  t=stripPunct(t).replace(/\s+/g,' ').trim();
  if(!keepAccents){t=t.normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC');}
  return t;
}
/* ---------- грамматика (grammar.js) ---------- */
var GRAMMAR=window.GRAMMAR||{plural:{},verbs:{}};
var SG_ENDINGS=['ούς','μα','ος','ας','ης','ής','άς','ές','α','ά','η','ή','ο','ό','ι','ί','υ','ύ','ω','ώ','ς'];
var PERSONS_RU=['я','ты','он / она / оно','мы','вы','они'],PERSONS_GR=['εγώ','εσύ','αυτός','εμείς','εσείς','αυτοί'];
function pluralOf(w){return GRAMMAR.plural[w.gr]||null;}
function splitArt(s){var m=String(s).normalize('NFC').trim().match(/^(ο|η|το|οι|τα)\s+(.+)$/i);return m?{art:m[1].toLowerCase(),word:m[2]}:{art:'',word:String(s).trim()};}
/* Разбиение «основа + окончание»: окончание ед. ч. берётся из списка известных, основа мн. ч. —
   та же длина с поправкой на сдвиг ударения (сравнение без ударений). */
function stemSplit(sg,pl){
  var a=splitArt(sg),b=splitArt(pl),w=a.word,v=b.word,end='';
  for(var i=0;i<SG_ENDINGS.length;i++){var e=SG_ENDINGS[i];if(w.length>e.length&&w.slice(-e.length)===e){end=e;break;}}
  if(!end)end=w.slice(-1);
  var stem=w.slice(0,w.length-end.length),stem2=v.slice(0,stem.length);
  if(norm(stem2,false)!==norm(stem,false)){var k=0;while(k<w.length&&k<v.length&&norm(w[k],false)===norm(v[k],false))k++;k=Math.max(1,Math.min(k,w.length-1,v.length-1));stem=w.slice(0,k);end=w.slice(k);stem2=v.slice(0,k);}
  return {art1:a.art,stem1:stem,end1:end,art2:b.art,stem2:stem2,end2:v.slice(stem2.length)};
}
function verbForms(w){
  var e=GRAMMAR.verbs[w.gr];if(!e)return null;if(e.f)return e.f;
  var g=w.gr;
  if(e.c==='1'){var st=g.replace(/ω$/,'');return [st+'ω',st+'εις',st+'ει',st+'ουμε',st+'ετε',st+'ουν / '+st+'ουνε'];}
  if(e.c==='2a'){var sa=g.replace(/(άω|ώ)$/,'');return [sa+'ώ / '+sa+'άω',sa+'άς',sa+'ά / '+sa+'άει',sa+'άμε / '+sa+'ούμε',sa+'άτε',sa+'άνε / '+sa+'ούν / '+sa+'ούνε'];}
  if(e.c==='2b'){var sb=g.replace(/ώ$/,'');return [sb+'ώ',sb+'είς',sb+'εί',sb+'ούμε',sb+'είτε',sb+'ούν / '+sb+'ούνε'];}
  return null;
}
function verbRu(w){var e=GRAMMAR.verbs[w.gr];return e&&e.ru;}
/* Слова, пригодные для режима: существительные с формой мн. ч. или глаголы со спряжением. */
function modePool(mode,pool){
  if(mode==='plural')return pool.filter(function(w){return w.pos==='n'&&pluralOf(w);});
  if(mode==='conj')return pool.filter(function(w){return w.pos==='v'&&verbForms(w);});
  return pool;
}
function variants(gr){return String(gr).split('/').map(function(v){return v.replace(/\([^)]*\)/g,'').trim();}).filter(Boolean);}
function primaryTarget(gr){var v=variants(gr);return (v[0]||gr).normalize('NFC');}
function lowerGr(s){return String(s).toLocaleLowerCase('el').replace(/σ(?=$|[\s;,.!?·:»"])/g,'ς');}
function grade(answer,gr){
  var vs=variants(gr);var i;
  for(i=0;i<vs.length;i++){if(norm(answer,true)===norm(vs[i],true))return 'exact';}
  for(i=0;i<vs.length;i++){if(norm(answer,false)===norm(vs[i],false))return 'accent';}
  return 'wrong';
}

var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
(function(){var vv=window.visualViewport;if(!vv)return;var app=document.getElementById('app');
  function fit(){var h=Math.round(vv.height);var full=Math.round(window.innerHeight);

/* Озвучка в исходном виде первой версии: cancel() и сразу speak(). Обходы для беззвучного
   режима iPhone (беззвучный аудиофайл перед речью, navigator.audioSession.type='playback')
   проверены на устройстве и не помогают: синтез речи глушится боковым переключателем. */
function speak(text){
  if(!canSpeak)return;
  try{
    var u=new SpeechSynthesisUtterance(primaryTarget(text));u.lang='el-GR';u.rate=0.9;
    var v=speechSynthesis.getVoices().filter(function(v){return /^el/i.test(v.lang);})[0];if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

function greekVoices(){var vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}return vs.filter(function(v){return /^el/i.test(v.lang);});}
function speechStatus(){
  if(!canSpeak)return 'Ошибка: браузер не поддерживает синтез речи.';
  var g=greekVoices(),all=[];try{all=speechSynthesis.getVoices()||[];}catch(e){}

}

  h+='<div class="prog"><div class="lab"><span>Изучено</span><b>'+lg+' / '+n+'</b></div><div class="bar"><i style="width:'+pct(lg,n)+'%"></i></div></div>';
  h+='</div>';
  h+='<h3>Режимы</h3>'+(homeMsg?'<p class="notice bad" style="margin-bottom:10px">'+esc(homeMsg)+'</p>':'')+'<div class="modes">'+MODE_LIST.map(function(m,i){
    return '<button class="mode" data-action="pick-mode" data-key="'+m.key+'"><span class="num">'+(i+1)+'</span><span class="txt"><div class="t">'+esc(m.t)+'</div><div class="d">'+esc(m.d)+'</div></span><span class="arr">›</span></button>';
  }).join('')+'</div>';
  if(!n){h+='<p class="notice" style="margin-top:16px">'+(set.mix?'Отметьте выше хотя бы один урок и хотя бы одну часть речи.':set.words.length?'Включите выше лексику и хотя бы одну часть речи.':'В этом наборе нет слов. Добавьте слова в words.js или импортируйте набор в настройках.')+'</p>';}
  return h;
}

/* ---------- запуск режима ----------
   Настройки тренировки живут на главном экране: лексика, «все / неизученные», перемешивание.
   Нажатие на режим сразу запускает тренировку. */
function freshCount(set){return poolWords(set).filter(function(w){return !isLearned(set,null,w);}).length;}
function startMode(key){
  var m=MODE_LIST.filter(function(x){return x.key===key;})[0];if(!m)return;
  var set=currentSet();if(!poolWords(set).length)return;
  if(!modePool(m.mode,poolWords(set)).length){homeMsg=m.mode==='plural'?'В выбранных словах нет существительных с формой множественного числа.':'В выбранных словах нет глаголов со спряжением.';render();return;}
  homeMsg='';
  var scope=store.settings.scope==='new'?'new':'all';
  if(scope==='new'&&!freshCount(set))scope='all';
  view={name:'session',key:key,mode:m.mode,dir:m.dir,scope:scope,shuffle:store.settings.shuffle!==false};
  trackEvent('mode/'+key,m.t);
  startSession();
}
function plural(n,a,b,c){var m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c;}

/* ---------- session ---------- */
function startSession(words){
  var set=currentSet();
  var pool=modePool(view.mode,poolWords(set));
  var scopeWords=pool.slice();if(view.scope==='new')scopeWords=scopeWords.filter(function(w){return !isLearned(set,view.dir,w);});
  if(!words){words=scopeWords.slice();if(view.shuffle)shuffle(words);}
  if(!words.length){goHome();return;}
  session={mode:view.mode,dir:view.dir,set:set,pool:pool,words:words,scopeWords:scopeWords,i:0,results:[],flipped:false,state:'ask',picked:[],tiles:null,options:null,typed:''};
  view.name='session';prepareItem();render();
}
function sessionTitle(){var t=MODE_TITLE[session.mode];if(session.mode==='flash'||session.mode==='quiz')t+=session.dir==='gr'?' · гр → ру':' · ру → гр';return t;}
function cur(){return session.words[session.i];}
function prepareItem(){
  session.flipped=false;session.state='ask';session.picked=[];session.typed='';session.grade=null;session.pickedOpt=null;session.hinted=false;
  var w=cur();if(!w)return;
  if(session.mode==='flash'&&session.dir==='gr'&&store.settings.autoSpeak)speak(w.gr);
  if(session.mode==='plural'){session.parts={a1:'',e1:'',a2:'',e2:''};}
  if(session.mode==='conj'){session.persons=session.persons||{};if(session.persons[w.gr]==null)session.persons[w.gr]=Math.floor(Math.random()*6);session.person=session.persons[w.gr];}
  if(session.mode==='tiles'){
    var target=lowerGr(primaryTarget(w.gr).replace(/[;?!.,·…:«»"]+$/,'').trim());
    session.target=target;
    var chars=Array.from(target).filter(function(c){return c!==' ';});
    var tiles=chars.map(function(c,k){return{ch:c,used:false,k:k};});
    var order=shuffle(tiles.slice());
    if(chars.length>1&&order.map(function(t){return t.ch;}).join('')===chars.join('')){order.reverse();}
    session.tiles=order;
  }
  if(session.mode==='quiz'){
    var ansKey=session.dir==='gr'?'ru':'gr';
    var correct=w[ansKey];
    var seen={};seen[norm(correct,true)]=true;
    var poolFrom=function(list){var out=list.filter(function(x){return x!==w;}).map(function(x){return x[ansKey];}).filter(function(p){var k=norm(p,true);if(seen[k])return false;seen[k]=true;return true;});return shuffle(out);};
    /* Шесть вариантов. Дистракторы той же темы, что и слово (кухня — кухня, части тела —
       части тела): из слов тренировки, затем из набора, затем из всех уроков; потом родительская
       тема (времена года → время), потом та же часть речи, и только потом любые слова. */
    var QUIZ_N=5;
    var sameTopic=function(list,t){return list.filter(function(x){return topicOf(x)===t&&posOf(x)===posOf(w);});};
    var samePos=function(list){return list.filter(function(x){return posOf(x)===posOf(w);});};
    var everything=[];allSets().forEach(function(t){everything=everything.concat(t.words,extraOf(t));});
    var scopeW=session.scopeWords||session.set.words,setW=session.set.words,tiers=[];
    [topicOf(w),TOPIC_PARENT[topicOf(w)]].forEach(function(t){if(t)tiers.push(sameTopic(scopeW,t),sameTopic(setW,t),sameTopic(everything,t));});
    tiers.push(samePos(scopeW),samePos(setW),samePos(everything),scopeW,setW,everything);
    var pool=[];for(var ti=0;ti<tiers.length&&pool.length<QUIZ_N;ti++)pool=pool.concat(poolFrom(tiers[ti]));
    session.options=shuffle([correct].concat(pool.slice(0,QUIZ_N)));
    session.correctOpt=correct;
  }
}
function progressHtml(){
  var n=session.words.length;var i=session.i;
  return '<div class="progress"><i style="width:'+pct(i,n)+'%"></i></div><div class="counter"><span>'+(i+1)+' / '+n+'</span><span>'+esc(session.set.title)+'</span></div>';
}
function speakBtn(text){return canSpeak?'<button class="chip" data-action="speak" data-text="'+esc(text)+'" aria-label="Озвучить">🔊 Озвучить</button>':'';}

function renderSession(){
  var w=cur();if(!w)return{html:'<p>Нет слов.</p>',foot:'<button class="btn" data-action="home">На главную</button>'};
  if(session.mode==='flash')return renderFlash(w);
  if(session.mode==='tiles')return renderTiles(w);
  if(session.mode==='type')return renderType(w);
  if(session.mode==='plural')return renderPlural(w);
  if(session.mode==='conj')return renderConj(w);
  return renderQuiz(w);
}

function renderFlash(w){
  var frontGr=session.dir==='gr';
  var learned=isLearned(session.set,session.dir,w);
  var front=frontGr?'<div class="lang">Греческий</div><div class="word">'+esc(w.gr)+'</div>':'<div class="lang">Русский</div><div class="word ru">'+esc(w.ru)+'</div>';
  var back=frontGr?'<div class="lang">Русский</div><div class="word ru">'+esc(w.ru)+'</div>':'<div class="lang">Греческий</div><div class="word">'+esc(w.gr)+'</div>';
  var mark=learned?'<div class="learned-mark">✓ изучено</div>':'';
  var h=progressHtml();
  h+='<div class="card-wrap"><div class="card'+(session.flipped?' flipped':'')+'" id="card" tabindex="0" role="button" aria-label="Карточка, нажмите чтобы перевернуть">'+
    '<div class="face front">'+mark+front+'</div><div class="face back">'+mark+back+'</div></div></div>';
  h+='<div class="card-tools">'+speakBtn(w.gr)+'<button class="chip'+(learned?' on':'')+'" data-action="toggle-learned">'+(learned?'✓ Изучено':'☆ Отметить изученным')+'</button></div>';
  h+='<div class="hint">Нажми на карточку, чтобы перевернуть. Свайп влево — следующее слово, вправо — предыдущее.</div>';
  var foot='<button class="btn ghost" data-action="prev" aria-label="Предыдущая"'+(session.i?'':' disabled')+'>←</button>'+
    '<button class="btn outline-bad" data-action="learning">Ещё учу</button>'+
    '<button class="btn good" data-action="know">Знаю ✓</button>';
  return{html:h,foot:foot};
}

/* Подсказка в режимах письма: прослушать греческое слово до ответа. Считается подсказкой:
   верный ответ после неё засчитывается как ошибка и слово возвращается в очередь. */
function promptRuHtml(w){
  var h='<div class="prompt"><div class="lang">Русский</div><div class="word ru">'+esc(w.ru)+'</div>';
  if(canSpeak){
    if(session.state==='ask')h+='<div class="card-tools" style="margin-top:12px"><button class="chip'+(session.hinted?' on':'')+'" data-action="speak-hint" data-text="'+esc(w.gr)+'">🔊 '+(session.hinted?'Подсказка использована':'Подсказка звуком')+'</button></div>';
    else h+='<div class="card-tools" style="margin-top:12px"><button class="chip" data-action="speak" data-text="'+esc(w.gr)+'">🔊 Озвучить</button></div>';
  }
  return h+'</div>';
}
function renderTiles(w){
  var h=progressHtml();
  h+=promptRuHtml(w);
  var tchars=Array.from(session.target);var p=0;var slots='';
  for(var i=0;i<tchars.length;i++){
    if(tchars[i]===' '){slots+='<span class="slot space"></span>';continue;}
    if(p<session.picked.length){slots+='<span class="slot filled">'+esc(session.tiles[session.picked[p]].ch)+'</span>';p++;}
    else slots+='<span class="slot"></span>';
  }
  h+='<div class="slots" aria-live="polite">'+slots+'</div>';
  h+='<div class="tiles">'+session.tiles.map(function(t,k){return '<button class="tile'+(t.used?' used':'')+'" data-action="tile" data-k="'+k+'"'+(t.used||session.state!=='ask'?' disabled':'')+'>'+esc(t.ch)+'</button>';}).join('')+'</div>';
  h+=resultHtml(w);
  var foot;
  if(session.state==='ask'){
    foot='<button class="btn ghost" data-action="undo" aria-label="Удалить последнюю букву"'+(session.picked.length?'':' disabled')+'>⌫</button>'+
      '<button class="btn" data-action="reset-tiles"'+(session.picked.length?'':' disabled')+'>Сбросить</button>';
  }else{foot=doneFoot();}
  return{html:h,foot:foot};
}

function renderType(w){
  var h=progressHtml();
  h+=promptRuHtml(w);
  h+='<form id="typeForm" style="margin-top:16px"><input type="text" id="typeInput" class="big" lang="el" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="греческое слово" value="'+esc(session.typed)+'"'+(session.state!=='ask'?' readonly':'')+'>'+(session.state==='ask'?'<button type="submit" class="btn primary" style="width:100%;margin-top:10px" data-action="check">Проверить</button>':'')+'</form>';
  if(session.state==='ask'){h+='<p class="hint">Переключи клавиатуру на греческую. Ударения учитываются.</p>';}
  h+=resultHtml(w);
  var foot=session.state==='ask'?'':doneFoot();
  return{html:h,foot:foot};
}

function hintBtnHtml(text){
  if(!canSpeak)return '';
  if(session.state==='ask')return '<div class="card-tools" style="margin-top:12px"><button class="chip'+(session.hinted?' on':'')+'" data-action="speak-hint" data-text="'+esc(text)+'">🔊 '+(session.hinted?'Подсказка использована':'Подсказка звуком')+'</button></div>';
  return '<div class="card-tools" style="margin-top:12px"><button class="chip" data-action="speak" data-text="'+esc(text)+'">🔊 Озвучить</button></div>';
}
/* Поле без примера-подсказки: что вписывать, подписано под полем. */
function gramInput(k,cls,val,caption){return '<span class="cell '+cls+'"><input type="text" class="gi" data-k="'+k+'" lang="el" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="'+caption+'" value="'+esc(val||'')+'"'+(session.state==='ask'?'':' disabled')+'><small>'+caption+'</small></span>';}
function renderPlural(w){
  var sp=stemSplit(w.gr,pluralOf(w)),P=session.parts||{};
  var h=progressHtml();
  h+='<div class="prompt"><div class="lang">Существительное</div><div class="word">'+esc(sp.stem1)+'<span class="muted">…</span></div><div class="muted" style="margin-top:4px">'+esc(w.ru)+'</div>'+hintBtnHtml(w.gr)+'</div>';
  h+='<form id="gramForm" class="gram">';
  h+='<div class="grow"><span class="lbl">Ед. ч.</span>'+gramInput('a1','art',P.a1,'артикль')+'<span class="stem">'+esc(sp.stem1)+'</span>'+gramInput('e1','end',P.e1,'окончание')+'</div>';
  h+='<div class="grow"><span class="lbl">Мн. ч.</span>'+gramInput('a2','art',P.a2,'артикль')+'<span class="stem">'+esc(sp.stem2)+'</span>'+gramInput('e2','end',P.e2,'окончание')+'</div>';
  if(session.state==='ask')h+='<p class="hint">Впиши артикль и окончание для единственного и множественного числа. Ударения можно не ставить.</p><button type="submit" class="btn primary" style="width:100%">Проверить</button>';
  h+='</form>';
  h+=gramResultHtml(w,sp.art1+' '+sp.stem1+sp.end1+' → '+sp.art2+' '+sp.stem2+sp.end2);
  return{html:h,foot:session.state==='ask'?'':doneFoot()};
}
function renderConj(w){
  var forms=verbForms(w),p=session.person,ru=verbRu(w);
  var h=progressHtml();
  h+='<div class="prompt"><div class="lang">Русский</div><div class="word ru">'+esc(ru[p])+'</div>'+hintBtnHtml(forms[p].split('/')[0].trim())+'</div>';
  h+='<form id="typeForm" style="margin-top:16px"><input type="text" id="typeInput" class="big" lang="el" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="форма глагола" value="'+esc(session.typed||'')+'"'+(session.state==='ask'?'':' disabled')+'>';
  if(session.state==='ask')h+='<p class="hint">Напиши глагол в нужном лице. Ударения учитываются.</p><button type="submit" class="btn primary" style="width:100%;margin-top:10px">Проверить</button>';
  h+='</form>';
  h+=gramResultHtml(w,PERSONS_GR[p]+' '+forms[p]);
  return{html:h,foot:session.state==='ask'?'':doneFoot()};
}
function gramResultHtml(w,full){
  if(session.state==='ask')return '';
  var g=session.grade;
  if(g==='exact')return '<div class="result ok" role="status"><span class="mark">✓</span><div class="body"><div>Верно!</div><div class="ans">'+esc(full)+'</div></div></div>';
  if(g==='hint')return '<div class="result almost" role="status"><span class="mark">✓</span><div class="body"><div>Верно, но с подсказкой.</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div></div>';
  if(g==='accent')return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверное ударение. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div></div>';
  return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверно. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div></div>';
}
function checkPlural(){
  var w=cur(),sp=stemSplit(w.gr,pluralOf(w)),P=session.parts||{};
  if(!(P.a1||P.e1||P.a2||P.e2)){var f=document.querySelector('.gi');if(f)f.focus();return;}
  var pairs=[[P.a1,sp.art1],[P.e1,sp.end1],[P.a2,sp.art2],[P.e2,sp.end2]];
  // Ударения в этом режиме не проверяются: тренируются артикль и окончание.
  var ok=pairs.every(function(q){return norm(q[0]||'',false)===norm(q[1],false);});
  var given=(P.a1||'')+' '+sp.stem1+(P.e1||'')+' / '+(P.a2||'')+' '+sp.stem2+(P.e2||'');
  finishItem(ok?'exact':'wrong',given);render();
}
function renderQuiz(w){
  var qGr=session.dir==='gr';
  var h=progressHtml();
  h+='<div class="prompt"><div class="lang">'+(qGr?'Греческий':'Русский')+'</div><div class="word'+(qGr?'':' ru')+'">'+esc(qGr?w.gr:w.ru)+'</div></div>';
  if(qGr&&canSpeak)h+='<div class="card-tools" style="margin-top:10px">'+speakBtn(w.gr)+'</div>';
  h+='<div class="options">'+session.options.map(function(o,k){
    var cls='opt';
    if(session.state!=='ask'){if(o===session.correctOpt)cls+=' correct';else if(k===session.pickedOpt)cls+=' wrong';}
    var b='<button class="'+cls+'" data-action="opt" data-k="'+k+'"'+(session.state!=='ask'?' disabled':'')+'>'+esc(o)+'</button>';
    if(!qGr&&canSpeak)b='<div class="optrow">'+b+'<button class="chip" data-action="speak" data-text="'+esc(o)+'" aria-label="Озвучить">🔊</button></div>';
    return b;
  }).join('')+'</div>';
  var foot='';
  if(session.state!=='ask'){foot=doneFoot();}
  return{html:h,foot:foot};
}

function resultHtml(w){
  if(session.state==='ask')return '';
  var writing=(session.mode==='tiles'||session.mode==='type');var g=session.grade;var full=writing?lowerGr(primaryTarget(w.gr)):primaryTarget(w.gr);
  var spk=(canSpeak&&!writing)?'<button class="chip" data-action="speak" data-text="'+esc(w.gr)+'">🔊</button>':'';
  if(g==='exact')return '<div class="result ok" role="status"><span class="mark">✓</span><div class="body"><div>Верно!</div></div>'+spk+'</div>';
  if(g==='hint')return '<div class="result almost" role="status"><span class="mark">✓</span><div class="body"><div>Верно, но с подсказкой.</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
  if(g==='accent')return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверное ударение. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
  return '<div class="result bad" role="status"><span class="mark">✗</span><div class="body"><div>Неверно. Правильно:</div><div class="ans">'+esc(full)+'</div><div class="small muted">Слово вернётся через несколько вопросов.</div></div>'+spk+'</div>';
}

function finishItem(grade,given){
  if(grade==='exact'&&session.hinted)grade='hint';
  session.grade=grade;session.state='done';
  var ok=grade==='exact';
  if(!session.results[session.i]){
    session.results[session.i]={word:cur(),ok:ok,grade:grade,given:given};
    if(!ok){var pos=Math.min(session.i+3,session.words.length);session.words.splice(pos,0,cur());session.requeued=true;}
  }
}
function learnedUpdates(){
  var set=session.set,dir=session.dir;var wrongW=firstWrong().map(function(r){return r.word;});
  var unlearn=wrongW.filter(function(w){return isLearned(set,dir,w);});
  var okW=uniqWords(session.words).filter(function(w){return wrongW.indexOf(w)<0&&session.results.some(function(r){return r&&r.word===w&&r.ok;});});
  var learn=okW.filter(function(w){return !isLearned(set,dir,w);});
  return{unlearn:unlearn,learn:learn};
}
function uniqWords(list){var seen={};return list.filter(function(w){if(seen[w.gr])return false;seen[w.gr]=true;return true;});}
function firstWrong(){var seen={};return session.results.filter(Boolean).filter(function(r){if(seen[r.word.gr])return false;seen[r.word.gr]=true;return !r.ok;});}
function doneFoot(){var wrong=session.grade!=='exact';
  return (wrong?'<button class="btn" data-action="retry">Ещё раз</button>':'')+'<button class="btn primary" data-action="next">Далее</button>';}
function next(){
  if(session.i+1>=session.words.length){view.name='end';trackEvent('done/'+view.key,'Завершено: '+sessionTitle());render();return;}
  session.i++;prepareItem();render();
}

/* ---------- end ---------- */
function renderEnd(){
  var h='',foot='';
  if(session.mode==='flash'){
    var known=session.results.filter(function(r){return r&&r.known;}).length;
    var learning=session.results.filter(function(r){return r&&!r.known;}).map(function(r){return r.word;});
    var total=session.words.length;
    h+='<div class="summary"><div class="score">'+known+'<small> / '+total+' знаю</small></div>';
    h+='<p class="muted">Изучено: '+learnedCount(session.set,null,session.pool)+' из '+session.pool.length+'.</p>';
    if(learning.length){h+='<h3 style="margin-top:6px">Ещё учу</h3><div class="mistakes">'+learning.map(function(w){return '<div class="mistake"><span class="g">'+esc(w.gr)+'</span><span class="r">'+esc(w.ru)+'</span></div>';}).join('')+'</div>';}
    h+='</div>';
    foot=(learning.length?'<button class="btn primary" data-action="retry-learning">Повторить те, что учу</button>':'')+'<button class="btn" data-action="restart">Сначала</button><button class="btn ghost" data-action="home">⌂</button>';
  }else{
    var res=session.results.filter(Boolean);
    var wrong=firstWrong();var total=uniqWords(session.words).length;var correct=total-wrong.length;
    var fixed=wrong.filter(function(r){return res.some(function(x){return x.word===r.word&&x.ok;});}).length;
    h+='<div class="summary"><div class="score">'+correct+'<small> / '+total+' с первой попытки</small></div>';

  }

function hasGreek(s){return /[Ͱ-Ͽἀ-῿]/.test(s);}
function parseImport(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);var out=[];
  lines.forEach(function(l){
    var parts;
    if(l.indexOf('\t')>=0)parts=l.split('\t');
    else if(/\s[-–—]\s/.test(l))parts=l.split(/\s[-–—]\s/);
    else if(l.indexOf(';')>=0&&!/;\s*$/.test(l))parts=l.split(';');
    else return;
    var a=parts[0].trim(),b=parts.slice(1).join(' ').trim();
    if(!a||!b)return;
    if(!hasGreek(a)&&hasGreek(b)){var t=a;a=b;b=t;}
    out.push({gr:a,ru:b});
  });
  return out;
}

      '<div class="row"><button class="btn" data-action="install-hide">Скрыть кнопку</button><button class="btn ghost" data-action="install-close">Закрыть</button></div>';
  }else{
    h+='<p style="margin:0 0 10px">Добавьте приложение на экран «Домой»: иконка Gr, без адресной строки.</p>'+
      '<div class="row"><button class="btn primary" data-action="install">Добавить приложение</button><button class="btn ghost" data-action="install-hide" aria-label="Скрыть">Скрыть</button></div>';
  }
  return h+'</div>';
}
function doInstall(){
  trackEvent('install-click','Добавить приложение');
  if(installPrompt){var p=installPrompt;installPrompt=null;try{p.prompt();}catch(e){}return;}
  installHelp=true;render();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action');
  if(el.tagName==='INPUT')return; /* handled on change */
  switch(a){
    case 'back':
      if(view.name==='settings'){settingsMsg='';confirmReset=false;confirmDelete=null;goHome();}
      else if(view.name==='session'||view.name==='end')goHome();
      else goHome();
      break;
    case 'settings':view={name:'settings'};settingsMsg='';render();break;
    case 'check-update':checkUpdate(true);break;
    case 'test-speech':speak('Καλημέρα');settingsMsg=speechStatus();render();break;
    case 'cheat':view={name:'cheat'};trackEvent('cheat','Шпаргалка');render();break;
    case 'fold':folds[el.getAttribute('data-key')]=!folds[el.getAttribute('data-key')];keepScroll=true;render();break;
    case 'topics-all':case 'topics-none':{
      var tpAll={};if(a==='topics-none'){TOPIC_LIST.concat([['other']]).forEach(function(q){tpAll[q[0]]=false;});}
      setTopics(el.getAttribute('data-for'),tpAll);keepScroll=true;render();break;
    }
    case 'home':goHome();break;
    case 'install':doInstall();break;
    case 'install-hide':hideInstall();break;
    case 'install-close':installHelp=false;render();break;
    case 'pick-mode':startMode(el.getAttribute('data-key'));break;
    case 'speak':speak(el.getAttribute('data-text'));break;
    case 'speak-hint':speak(el.getAttribute('data-text'));if(session&&!session.hinted){session.hinted=true;render();}break;
    case 'toggle-learned':{var w=cur();setLearned(session.set,session.dir,w,!isLearned(session.set,session.dir,w));render();break;}
    case 'know':flashAnswer(true);break;
    case 'learning':flashAnswer(false);break;
    case 'prev':if(session.i>0){session.i--;prepareItem();render();}break;
    case 'tile':{
      if(session.state!=='ask')break;
      var k=+el.getAttribute('data-k');var t=session.tiles[k];if(!t||t.used)break;
      t.used=true;session.picked.push(k);
      var need=session.tiles.length;
      if(session.picked.length>=need){
        var built=session.picked.map(function(i){return session.tiles[i].ch;}).join('');
        var want=Array.from(session.target).filter(function(c){return c!==' ';}).join('');
        finishItem(built.normalize('NFC')===want.normalize('NFC')?'exact':'wrong',built);
      }
      render();break;
    }
    case 'undo':if(session.picked.length){var last=session.picked.pop();session.tiles[last].used=false;render();}break;
    case 'reset-tiles':session.picked=[];session.tiles.forEach(function(t){t.used=false;});render();break;
    case 'check':checkTyped();break;
    case 'retry':prepareItem();render();break;
    case 'next':next();break;
    case 'opt':{
      if(session.state!=='ask')break;
      var kk=+el.getAttribute('data-k');session.pickedOpt=kk;
      var ok=session.options[kk]===session.correctOpt;
      finishItem(ok?'exact':'wrong',session.options[kk]);render();
      if(ok){setTimeout(function(){if(session&&session.state==='done'&&view.name==='session')next();},650);}
      break;
    }
    case 'retry-learning':{var ws=session.results.filter(function(r){return r&&!r.known;}).map(function(r){return r.word;});startSession(ws);break;}
    case 'unlearn-wrong':{var u1=learnedUpdates().unlearn;u1.forEach(function(w){setLearned(session.set,session.dir,w,false);});session.endMsg='Снята отметка «изучено»: '+u1.length+' '+plural(u1.length,'слово','слова','слов')+'.';render();break;}
    case 'learn-correct':{var u2=learnedUpdates().learn;u2.forEach(function(w){setLearned(session.set,session.dir,w,true);});session.endMsg='Отмечено изученными: '+u2.length+' '+plural(u2.length,'слово','слова','слов')+'.';render();break;}
    case 'retry-wrong':{var ww=firstWrong().map(function(r){return r.word;});startSession(ww);break;}
    case 'restart':{var all=uniqWords(session.words);if(view.shuffle)shuffle(all);startSession(all);break;}
    case 'reset-progress':confirmReset=true;render();break;
    case 'reset-progress-no':confirmReset=false;render();break;
    case 'reset-progress-yes':{var s=currentSet();store.progress[s.id]={all:[]};save();confirmReset=false;settingsMsg='Прогресс набора «'+s.title+'» сброшен.';render();break;}
    case 'import':doImport();break;
    case 'delete-set':confirmDelete=el.getAttribute('data-id');render();break;
    case 'delete-set-no':confirmDelete=null;render();break;
    case 'delete-set-yes':{
      var id=el.getAttribute('data-id');store.custom=(store.custom||[]).filter(function(c){return c.id!==id;});delete store.progress[id];
      if(store.setId===id)store.setId=null;save();confirmDelete=null;settingsMsg='Набор удалён.';render();break;
    }
  }
});

document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='setSelect'){store.setId=el.value;
    if(el.value===MIX_ID&&!allSets().some(function(x){return store.mix&&store.mix[x.id];})){store.mix={_pos:Object.assign({},POS_DEFAULT),_posV:2};allSets().forEach(function(s){store.mix[s.id]={w:true,x:false};});}
    save();render();return;}
  if(el.getAttribute('data-action')==='lex-toggle'){var cs=currentSet();if(!store.lex)store.lex={};store.lex[cs.id]=Object.assign({},lexCfg(cs));store.lex[cs.id][el.getAttribute('data-part')]=el.checked;save();render();return;}
  if(el.getAttribute('data-action')==='lex-pos'){var ps=currentSet();if(!store.lex)store.lex={};var lc2=Object.assign({},lexCfg(ps));lc2.pos=lexPos(ps);lc2.pos[el.getAttribute('data-part')]=el.checked;store.lex[ps.id]=lc2;save();keepScroll=true;render();return;}
  if(el.getAttribute('data-action')==='topic'){var tgt=el.getAttribute('data-for'),tp3=Object.assign({},tgt==='mix'?mixTopics():lexTopics(currentSet()));
    if(el.checked)delete tp3[el.getAttribute('data-part')];else tp3[el.getAttribute('data-part')]=false;setTopics(tgt,tp3);keepScroll=true;render();return;}
  if(el.getAttribute('data-action')==='mix-pos'){if(!store.mix)store.mix={};store.mix._pos=mixPos();store.mix._pos[el.getAttribute('data-part')]=el.checked;save();keepScroll=true;render();return;}
  if(el.getAttribute('data-action')==='mix-toggle'){var mid=el.getAttribute('data-id'),part=el.getAttribute('data-part');
    if(!store.mix)store.mix={};if(!store.mix[mid])store.mix[mid]={w:false,x:false};store.mix[mid][part]=el.checked;save();keepScroll=true;render();return;}
  var a=el.getAttribute('data-action');if(!a)return;
  if(a==='set-scope'){store.settings.scope=el.value;save();render();}
  else if(a==='set-shuffle'){store.settings.shuffle=el.checked;save();}
  else if(a==='set-autospeak'){store.settings.autoSpeak=el.checked;save();}
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='typeInput'&&session)session.typed=el.value;
  if(el.classList&&el.classList.contains('gi')&&session&&session.parts)session.parts[el.getAttribute('data-k')]=el.value;
  if(el.id==='importText')view.importText=el.value;
  if(el.id==='importTitle')view.importTitle=el.value;
});
document.addEventListener('submit',function(ev){
  if(ev.target.id==='typeForm'){ev.preventDefault();if(session.state==='ask')checkTyped();else next();}
  if(ev.target.id==='gramForm'){ev.preventDefault();if(session.state==='ask')checkPlural();else next();}
});
document.addEventListener('keydown',function(ev){
  if(view.name!=='session'||!session)return;
  if(session.mode==='flash'){
    if(ev.key===' '||ev.key==='Enter'){if(ev.target.tagName!=='BUTTON'){ev.preventDefault();flip();}}
    else if(ev.key==='ArrowRight')flashAnswer(true);
    else if(ev.key==='ArrowLeft')flashAnswer(false);
  }else if(ev.key==='Enter'&&session.state==='done'&&ev.target.tagName!=='BUTTON'){next();}
});

function checkTyped(){
  var inp=document.getElementById('typeInput');var val=inp?inp.value:session.typed;
  if(!val.trim()){if(inp)inp.focus();return;}
  session.typed=val;finishItem(grade(val,session.mode==='conj'?verbForms(cur())[session.person]:cur().gr),val);render();
}
function flashAnswer(known){
  var w=cur();setLearned(session.set,session.dir,w,known);
  session.results[session.i]={word:w,known:known};
  next();
}
function flip(){
  session.flipped=!session.flipped;
  var c=document.getElementById('card');if(c)c.classList.toggle('flipped',session.flipped);
  if(store.settings.autoSpeak){var showsGr=(session.dir==='gr')!==session.flipped;if(showsGr)speak(cur().gr);}
}

/* swipe: влево — следующее слово, вправо — предыдущее; тап по карточке — перевернуть */
var drag=null,suppressClick=false;
function swipeTarget(ev){
  if(view.name!=='session'||!session)return null;
  var c=ev.target.closest('#card');if(c)return{el:c,card:true};
  if(ev.target.closest('input,textarea,select'))return null;
  return{el:screen.firstElementChild,card:false};
}
function swipeNext(){
  if(session.mode==='flash'){next();return true;}
  if(session.state!=='ask'){next();return true;}
  return false;
}
function swipePrev(){
  if(session.i>0){session.i--;prepareItem();render();return true;}
  return false;
}
screen.addEventListener('pointerdown',function(ev){
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  var t=swipeTarget(ev);if(!t)return;
  /* Без setPointerCapture: в Chrome при захвате click уходит на захвативший элемент,
     и кнопки внутри упражнения перестают срабатывать от мыши. Касания и так захватываются
     неявно, а pointerup ловим на document. */
  drag={x:ev.clientX,y:ev.clientY,dx:0,el:t.el,card:t.card,id:ev.pointerId,moved:false};
});
screen.addEventListener('pointermove',function(ev){
  if(!drag||ev.pointerId!==drag.id)return;
  drag.dx=(ev.clientX-drag.x)/appZoom;var dy=(ev.clientY-drag.y)/appZoom;
  if(!drag.moved&&Math.abs(drag.dx)>8&&Math.abs(drag.dx)>Math.abs(dy))drag.moved=true;
  if(!drag.moved||!drag.el)return;
  var dx=drag.dx;
  if((dx<0&&session.mode!=='flash'&&session.state==='ask')||(dx>0&&session.i===0))dx=dx/4;
  if(drag.card){drag.el.classList.add('drag');drag.el.style.transform='translateX('+dx+'px) rotate('+(dx/25)+'deg)'+(session.flipped?' rotateY(180deg)':'');}
  else{drag.el.classList.add('drag');drag.el.style.transform='translateX('+(dx/2)+'px)';}
});
function endDrag(ev){
  if(!drag||ev.pointerId!==drag.id)return;
  var el=drag.el,dx=drag.dx,moved=drag.moved,card=drag.card;drag=null;
  if(el){el.classList.remove('drag');el.style.transform='';}
  if(moved){
    suppressClick=true;setTimeout(function(){suppressClick=false;},350);
    if(Math.abs(dx)>70){if(dx<0)swipeNext();else swipePrev();}
  }else if(card&&Math.abs(dx)<8){flip();}
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',function(ev){if(drag&&ev.pointerId===drag.id){if(drag.el){drag.el.classList.remove('drag');drag.el.style.transform='';}drag=null;}});
document.addEventListener('click',function(ev){if(suppressClick){ev.stopPropagation();ev.preventDefault();}},true);

/* автообновление: сверяем сборку с сервером, при расхождении перезагружаем страницу.
   Перед перезагрузкой состояние экрана и текущего упражнения сохраняется в sessionStorage
   и восстанавливается после неё, чтобы обновление не сбивало процесс. */
var RESUME_KEY='greek-words:resume';
function saveResume(){
  try{
    var data={view:view,setId:currentSet().id};
    if(session&&(view.name==='session'||view.name==='end')){
      var s=session;
      data.session={mode:s.mode,dir:s.dir,i:s.i,requeued:!!s.requeued,hinted:!!s.hinted,parts:s.parts||null,person:s.person,persons:s.persons||null,flipped:!!s.flipped,state:s.state,picked:s.picked||[],typed:s.typed||'',
        grade:s.grade,pickedOpt:s.pickedOpt,tiles:s.tiles,options:s.options,correctOpt:s.correctOpt,target:s.target,
        words:s.words.map(function(w){return w.gr;}),scopeWords:(s.scopeWords||[]).map(function(w){return w.gr;}),
        results:Array.prototype.map.call(s.results,function(r){return r?Object.assign({},r,{word:r.word.gr}):null;})};
    }
    sessionStorage.setItem(RESUME_KEY,JSON.stringify(data));
  }catch(e){}
}
function restoreResume(){
  var raw=null;try{raw=sessionStorage.getItem(RESUME_KEY);sessionStorage.removeItem(RESUME_KEY);}catch(e){}
  if(!raw)return false;
  try{
    var d=JSON.parse(raw);if(!d||!d.view||!d.view.name||d.view.name==='setup')return false;
    if(d.setId&&d.setId!==currentSet().id){if(d.setId!==MIX_ID&&!allSets().some(function(x){return x.id===d.setId;}))return false;store.setId=d.setId;}
    var v=d.view,set=currentSet();
    if(v.name==='session'||v.name==='end'){
      var sv=d.session;if(!sv)return false;
      var byGr={};set.words.concat(extraOf(set)).forEach(function(w){byGr[w.gr]=w;});
      var res=function(k){var w=byGr[k];if(!w)throw new Error('missing word '+k);return w;};
      session={mode:sv.mode,dir:sv.dir,set:set,pool:poolWords(set),words:sv.words.map(res),scopeWords:sv.scopeWords.map(res),i:sv.i,
        results:sv.results.map(function(r){return r?Object.assign({},r,{word:res(r.word)}):null;}),requeued:sv.requeued,hinted:!!sv.hinted,parts:sv.parts||null,person:sv.person,persons:sv.persons||null,
        flipped:sv.flipped,state:sv.state,picked:sv.picked,typed:sv.typed,grade:sv.grade,pickedOpt:sv.pickedOpt,tiles:sv.tiles,options:sv.options,correctOpt:sv.correctOpt,target:sv.target};
      if(v.name==='session'&&!session.words[session.i])throw new Error('bad index');
    }
    view=v;return true;
  }catch(e){session=null;view={name:'home'};return false;}
}
function reloadForUpdate(remote,manual){
  var key='greek-words:reload:'+remote;
  if(!manual&&sessionStorage.getItem(key))return false;
  try{sessionStorage.setItem(key,'1');}catch(e){}
  if(!manual)saveResume();
  /* Не reload(): Safari может отдать index.html из HTTP-кеша (max-age 600 у GitHub Pages).
     Адрес с номером сборки в параметре кеш обойти не может. */
  location.replace(location.pathname+'?b='+encodeURIComponent(remote));return true;
}
function checkUpdate(manual){
  if(!window.fetch||!APP_BUILD){if(manual){settingsMsg='Проверка недоступна.';render();}return;}
  var url=location.pathname.replace(/[^\/]*$/,'')+'index.html?u='+Date.now();
  fetch(url,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var m=t.match(/<meta name="build" content="([^"]+)"/);var remote=m?m[1]:'';
    if(remote&&remote!==APP_BUILD){
      if(reloadForUpdate(remote,manual))return;
    }
    if(manual){settingsMsg=remote===APP_BUILD?'У вас последняя версия.':'Не удалось сравнить версии.';render();}
  }).catch(function(){if(manual){settingsMsg='Ошибка: нет связи с сервером.';render();}});
}
checkUpdate(false);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate(false);});

function doImport(){
  var title=(document.getElementById('importTitle')||{}).value||'';var text=(document.getElementById('importText')||{}).value||'';
  var words=parseImport(text);
  if(!words.length){settingsMsg='Ошибка: не удалось разобрать ни одной строки. Нужен формат «греческий<TAB>русский» или «греческий - русский».';render();return;}
  title=title.trim()||('Мой набор '+((store.custom||[]).length+1));
  var id='custom-'+Date.now().toString(36);
  store.custom=store.custom||[];store.custom.push({id:id,title:title,words:words});
  store.setId=id;save();
  view.importText='';view.importTitle='';
  settingsMsg='Импортировано слов: '+words.length+'. Набор «'+title+'» выбран.';render();
}

restoreResume();
render();
})();
</script>
